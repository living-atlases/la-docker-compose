---
- hosts: docker_compose
  gather_facts: yes
  become: yes
  tasks:
    # Non-destructive redeploy guard. The `docker` role's "Setup docker daemon"
    # task rewrites /etc/docker/daemon.json and notifies "Restart docker" ->
    # `systemctl restart docker`, which stops EVERY container (incl. nginx, the
    # single entrypoint) for ~20s. On a redeploy over a live stack that is a
    # full-site outage on every run (CI #316: two ~22s nginx connection-refusal
    # windows, one per `docker` role invocation). So only manage the daemon when
    # there is NO live la_* stack yet (first install); on a redeploy leave the
    # already-running, already-configured daemon untouched. Override in a
    # maintenance window with -e manage_docker_daemon=true.
    - name: "Detect a live la_* stack (to skip Docker-daemon management on redeploys)"
      shell: docker ps --filter "name=la_" --filter "status=running" -q | head -1
      register: la_stack_live_probe
      changed_when: false
      failed_when: false
      tags: [always, docker]

    # Compute UNCONDITIONALLY from the probe — do NOT `| default(manage_docker_daemon)`:
    # site.yml import_role's la-compose statically, so its role default
    # (manage_docker_daemon: true) is already defined at play start, which made the
    # default() a no-op and left it true even with a live stack (#319: the probe
    # returned a container id but the daemon was reconfigured+restarted anyway).
    # set_fact from the probe is authoritative; an explicit -e manage_docker_daemon=…
    # still wins because extra-vars outrank set_fact.
    - name: "Decide whether to manage the Docker daemon this run"
      set_fact:
        manage_docker_daemon: "{{ (la_stack_live_probe.stdout | default('') | trim) == '' }}"
      tags: [always, docker]

    - name: "Report Docker-daemon management decision"
      debug:
        msg: >-
          manage_docker_daemon={{ manage_docker_daemon }}
          ({{ 'first install — configuring daemon' if manage_docker_daemon | bool
              else 'live stack detected — leaving daemon untouched (non-destructive redeploy)' }})
      tags: [always, docker]

    - name: Ensure Docker is installed
      import_role:
        name: docker
      when: manage_docker_daemon | bool
      tags:
        - always
        - docker

    - name: Generate docker-compose deployment files
      import_role:
        name: la-compose
