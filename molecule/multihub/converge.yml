---
# Unit tests for roles/la-compose/tasks/setup-hub-facts.yml
#
# Covers:
#   1. The portal is always instance #0, with an empty suffix, so a deployment
#      without hubs renders exactly what it rendered before hubs existed.
#   2. Each hub gets its own data dir names and its resolved aliases.
#   3. A hub whose records front-end lives on ANOTHER docker host is not rendered here.
#   4. use_species/use_regions follow both la_hubs and the groups actually present.
#   5. use_branding follows branding_source: no source means the hub reuses the
#      portal's branding through its header_and_footer_baseurl.
#   6. skip_hubs and la_hub_only narrow the list.

- name: Unit test setup-hub-facts.yml
  hosts: localhost
  gather_facts: false

  vars:
    # Inputs the fact file reads from the wider setup-facts pipeline.
    services_enabled: ['ala_hub', 'ala_bie', 'regions', 'branding']
    biocache_hub: ala-hub
    branding_source: ../lademo-branding
    # What generator-living-atlas emits in [docker_compose:vars].
    # Enough of the compose vars for TC13-14 to render the real templates (see below).
    # Values are irrelevant to the cross-check; only the conditions are.
    tc13_flag: {'biocache-hub': 'use_records', 'bie-hub': 'use_species', 'regions': 'use_regions'}
    physical_server_groups: []
    data_dir: /data
    docker_network: internal
    deployment_type: container
    server_tz: UTC
    docker_extra_hosts_dict: {}
    i18n:
      enabled: true
      strategy: volume
      volume: {name: ala-i18n-data, source: init-container}
    la_hubs:
      - {pkg: lademohub, use_species: true, use_regions: true,
         branding_source: 'https://github.com/living-atlases/base-branding'}
      - {pkg: lademohub2, use_species: false, use_regions: false, branding_source: null}
      - {pkg: elsewhere, use_species: true, use_regions: true, branding_source: null}

  tasks:

    - name: "[TC1-5] Compute hub facts"
      ansible.builtin.include_tasks: ../../roles/la-compose/tasks/setup-hub-facts.yml

    - name: "[TC1] The portal is instance #0 and keeps its current names"
      ansible.builtin.assert:
        that:
          - hub_instances[0].is_portal
          - hub_instances[0].pkg == ''
          - hub_instances[0].suffix == ''
          - hub_instances[0].biocache_hub == 'ala-hub'
          - hub_instances[0].bie_hub == 'ala-bie-hub'
          - hub_instances[0].regions == 'regions'
        fail_msg: "portal instance drifted: {{ hub_instances[0] }}"

    - name: "[TC2] Each hub gets suffixed data dirs and its resolved aliases"
      ansible.builtin.assert:
        that:
          - hub_instances[1].pkg == 'lademohub'
          - hub_instances[1].suffix == '-lademohub'
          - hub_instances[1].biocache_hub == 'lademohub-hub'
          - hub_instances[1].bie_hub == 'lademohub-bie-hub'
          - hub_instances[1].regions == 'lademohub-regions'
          - hub_instances[1].aliases['biocache-hub'] == 'localhost.ala_hub_lademohub'
          - hub_instances[1].aliases['branding'] == 'localhost.branding_lademohub'
        fail_msg: "hub instance drifted: {{ hub_instances[1] }}"

    - name: "[TC3] A hub deployed on another docker host is not rendered here"
      ansible.builtin.assert:
        that:
          - "'elsewhere' not in (hub_instances | map(attribute='pkg') | list)"
          - hub_instances | length == 3
        fail_msg: "rendered hubs: {{ hub_instances | map(attribute='pkg') | list }}"

    - name: "[TC4] A records-only hub declares no species and no regions"
      ansible.builtin.assert:
        that:
          - not hub_instances[2].use_species
          - not hub_instances[2].use_regions
          - hub_instances[1].use_species
          - hub_instances[1].use_regions

    - name: "[TC5] Branding is per hub and follows branding_source"
      ansible.builtin.assert:
        that:
          - hub_instances[1].use_branding
          - not hub_instances[2].use_branding
        fail_msg: "branding: {{ hub_instances | map(attribute='use_branding') | list }}"

    - name: "[TC6] skip_hubs drops a hub without touching the portal"
      ansible.builtin.include_tasks: ../../roles/la-compose/tasks/setup-hub-facts.yml
      vars:
        skip_hubs: "lademohub2"

    - name: "[TC6] assert skip_hubs"
      ansible.builtin.assert:
        that:
          - hub_instances | map(attribute='pkg') | list == ['', 'lademohub']
        fail_msg: "skip_hubs ignored: {{ hub_instances | map(attribute='pkg') | list }}"

    # la_hub_only must NOT shorten the list: docker-compose.yml is one file, so a hub
    # missing from the render loses its include and the next `up` removes containers
    # nobody asked to remove. It only says which hub re-renders its (slow) app config.
    - name: "[TC7] la_hub_only narrows the config work, not the stack"
      ansible.builtin.include_tasks: ../../roles/la-compose/tasks/setup-hub-facts.yml
      vars:
        skip_hubs: []
        la_hub_only: lademohub2

    - name: "[TC7] assert la_hub_only"
      ansible.builtin.assert:
        that:
          - hub_instances | map(attribute='pkg') | list == ['', 'lademohub', 'lademohub2']
          - hub_instances | selectattr('render_config') | map(attribute='pkg') | list == ['', 'lademohub2']
        fail_msg: >-
          la_hub_only mishandled: pkgs={{ hub_instances | map(attribute='pkg') | list }}
          render={{ hub_instances | map(attribute='render_config') | list }}

    # This is how it really arrives: the ini plugin literal_evals inventory values
    # and JSON's lowercase true/null are not Python literals, so the whole list
    # comes through as one string. A real deploy died on `h.pkg` here.
    - name: "[TC9] la_hubs as the ini plugin delivers it: one JSON string"
      ansible.builtin.include_tasks: ../../roles/la-compose/tasks/setup-hub-facts.yml
      vars:
        skip_hubs: []
        la_hubs: >-
          [{"pkg":"lademohub","use_species":true,"use_regions":true,"branding_source":"https://github.com/living-atlases/base-branding"},{"pkg":"lademohub2","use_species":false,"use_regions":false,"branding_source":null}]

    - name: "[TC9] assert the string form yields the same instances"
      ansible.builtin.assert:
        that:
          - hub_instances | map(attribute='pkg') | list == ['', 'lademohub', 'lademohub2']
          - hub_instances[1].use_branding
          - not hub_instances[2].use_branding
          - not hub_instances[2].use_species
        fail_msg: "la_hubs as text was not parsed: {{ hub_instances }}"

    # ---------------------------------------------------------------- issue #14
    # A hub may be SPREAD across compose hosts. Presence is "any alias resolves here",
    # not "the records alias resolves here", and every front-end is its own flag.
    - name: "[TC10-11] Hubs spread across docker hosts"
      ansible.builtin.include_tasks: ../../roles/la-compose/tasks/setup-hub-facts.yml
      vars:
        skip_hubs: []
        la_hubs:
          - {pkg: splithub, use_species: true, use_regions: true, branding_source: null}
          - {pkg: farhub, use_species: true, use_regions: true,
             branding_source: 'https://github.com/living-atlases/base-branding'}

    - name: "[TC10] A hub with records here and species elsewhere renders records only"
      ansible.builtin.assert:
        that:
          - hub_instances[1].pkg == 'splithub'
          - hub_instances[1].use_records
          - not hub_instances[1].use_species
          - not hub_instances[1].use_regions
        fail_msg: "splithub: {{ hub_instances[1] }}"

    # The regression this whole change is about: before it, a hub whose records front-end
    # lives on another machine resolved to nothing here and its species and regions were
    # silently never deployed.
    - name: "[TC11] A hub whose records live elsewhere still renders its species here"
      ansible.builtin.assert:
        that:
          - hub_instances | map(attribute='pkg') | list == ['', 'splithub', 'farhub']
          - not hub_instances[2].use_records
          - hub_instances[2].use_species
          - hub_instances[2].use_regions
          - not hub_instances[2].use_branding
          - "'biocache-hub' not in hub_instances[2].aliases"
          - hub_instances[2].aliases['bie-hub'] == 'localhost.ala_bie_farhub'
        fail_msg: "farhub: {{ hub_instances[2] }}"

    # use_branding is what decides whether branding{{ suffix }}.yml, its external volume
    # and its vhost are rendered. farhub declares a branding_source but placed it on the
    # other machine, so this host must not claim it (a second branding container on the
    # same public vhost is validate-topology check 2).
    # use_branding decides the container, its volume and its vhost; has_branding decides
    # the readiness gate, which is a curl poll on the public URL and therefore belongs on
    # every host carrying one of this hub's front-ends. farhub declares a branding but
    # placed it on the other machine: this host waits for it without serving it.
    - name: "[TC11] Branding renders where placed, but the gate follows the front-ends"
      ansible.builtin.assert:
        that:
          - not hub_instances[2].use_branding
          - hub_instances[2].has_branding
          - "'branding' not in hub_instances[2].aliases"
          - not hub_instances[1].has_branding
        fail_msg: "farhub branding: {{ hub_instances[2] }}"

    # A hub SPREAD across hosts emits one slice per host, but the Cypress suite reads
    # ONE e2e-targets.json. The two stub docker_compose hosts in the inventory carry
    # the slices a split lademohub produces.
    - name: "[TC12] The per-host e2e slices of a spread hub are joined into one entry"
      ansible.builtin.include_tasks: ../../roles/la-compose/tasks/merge-hub-e2e-targets.yml

    - name: "[TC12] assert the merge"
      ansible.builtin.assert:
        that:
          - e2e_targets_hubs_merged | map(attribute='key') | list == ['lademohub', 'lademohub2']
          - e2e_targets_hubs_merged[0].services | length == 3
          - e2e_targets_hubs_merged[0].services.records == 'https://records-hub.l-a.site'
          - e2e_targets_hubs_merged[0].services.species == 'https://species-hub.l-a.site'
          - e2e_targets_hubs_merged[0].services.regions == 'https://regions-hub.l-a.site'
          - e2e_targets_hubs_merged[0].name == 'LA Demo Hub'
          - e2e_targets_hubs_merged[0].queryContext == 'data_hub_uid:dh3'
          - e2e_targets_hubs_merged[0].branding == 'https://hub.l-a.site'
          - e2e_targets_hubs_merged[1].services | length == 1
        fail_msg: "merged hubs: {{ e2e_targets_hubs_merged }}"

    - name: "[TC8] service_aliases never resolves the portal to a hub alias"
      ansible.builtin.set_fact:
        portal_alias: >-
          {%- set matching = groups['biocache-hub'] | select('match', '^' ~ ansible_host ~ '(\..+)?$') | list -%}
          {%- set hub_aliases = [] -%}
          {%- for g in groups.keys() | select('match', '^hub-') -%}
            {%- set _ = hub_aliases.extend(groups[g] | default([])) -%}
          {%- endfor -%}
          {{ (matching | reject('in', hub_aliases) | list) }}

    - name: "[TC8] assert portal alias"
      ansible.builtin.assert:
        that:
          - portal_alias == ['localhost.ala_hub']
        fail_msg: "portal alias would be hijacked by a hub: {{ portal_alias }}"

    # ------------------------------------------------------------------ TC13-14
    # Everything above is fact-level. The failure these guard against is not: a
    # `depends_on` naming a service no include provides makes EVERY docker compose
    # command on that host die at parse time (the #284/#285 class). The condition
    # that emits the dependency lives in the service template and the condition that
    # includes the gate lives in base.yml.j2, so the two can drift apart silently.
    # So render the real templates with the real facts and cross-check them.
    - name: "[TC13] Somewhere to render into"
      ansible.builtin.tempfile:
        state: directory
        suffix: -compose-render
      register: tc13_dir

    # hub_instances here is still the TC10-11 split set: splithub (records here, no
    # branding of its own) and farhub (species+regions here, branding on the other
    # machine). Both lean on a gate rendered under a condition they do not control.
    - name: "[TC13] Render base.yml.j2 with the split hub facts"
      ansible.builtin.template:
        src: ../../roles/la-compose/templates/docker-compose/base.yml.j2
        dest: "{{ tc13_dir.path }}/docker-compose.yml"
        mode: "0644"

    - name: "[TC13] Render every hub front-end fragment the base includes"
      ansible.builtin.template:
        src: "../../roles/la-compose/templates/docker-compose/services/{{ item.1 }}.yml.j2"
        dest: "{{ tc13_dir.path }}/{{ item.1 }}{{ item.0.suffix }}.yml"
        mode: "0644"
      vars:
        inst: "{{ item.0 }}"
      loop: "{{ (hub_instances | rejectattr('is_portal') | list) | product(['biocache-hub', 'bie-hub', 'regions']) | list }}"
      loop_control:
        label: "{{ item.1 }}{{ item.0.suffix }}"
      when: item.0[tc13_flag[item.1]]
      # which use_* flag gates which fragment

    # The portal's own three, rendered WITHOUT inst so the template defaults apply --
    # the path a deployment that has never heard of hubs takes.
    - name: "[TC13] Render the portal's front-ends the same way"
      ansible.builtin.template:
        src: "../../roles/la-compose/templates/docker-compose/services/{{ item }}.yml.j2"
        dest: "{{ tc13_dir.path }}/{{ item }}.yml"
        mode: "0644"
      loop: ['biocache-hub', 'bie-hub', 'regions']

    - name: "[TC13] The fragments that were rendered"
      ansible.builtin.find:
        paths: "{{ tc13_dir.path }}"
        patterns: "*.yml"
        excludes: "docker-compose.yml"
      register: tc13_fragments

    - name: "[TC13] Collect what the base includes and what the fragments depend on"
      ansible.builtin.set_fact:
        # Include lines are `  - ./services/x.yml`; the service a depends_on names maps
        # to the fragment of the same basename (i18n-init is the one exception, it lives
        # in infrastructure/i18n.yml).
        tc13_included: >-
          {{ lookup('file', tc13_dir.path ~ '/docker-compose.yml').splitlines()
             | map('regex_search', '^\s+- \./(?:services|infrastructure)/(.+)\.yml$', '\1')
             | reject('none') | map('first') | list }}
        tc13_deps: >-
          {%- set out = [] -%}
          {%- for f in (tc13_fragments.files | map(attribute='path') | list) -%}
            {%- set doc = lookup('file', f) | from_yaml -%}
            {%- for svc, spec in (doc.services | default({})).items() -%}
              {%- for dep in (spec.depends_on | default({})).keys() -%}
                {%- set _ = out.append({'fragment': f | basename, 'service': svc, 'needs': dep}) -%}
              {%- endfor -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out }}

    - name: "[TC13] Every depends_on target is a service the base actually includes"
      ansible.builtin.assert:
        that:
          - tc13_included | length > 0
          - tc13_deps | length > 0
          - tc13_dangling | length == 0
        fail_msg: >-
          compose would not parse: {{ tc13_dangling }} -- included fragments were
          {{ tc13_included }}
        success_msg: "{{ tc13_deps | length }} depends_on edge(s), all provided"
      vars:
        tc13_dangling: >-
          {{ tc13_deps | rejectattr('needs', 'in',
               tc13_included + (['i18n-init'] if 'i18n' in tc13_included else [])) | list }}

    # The specific edge the split exercises: splithub declares no branding of its own, so
    # it waits on the PORTAL's unsuffixed gate -- which base.yml.j2 only includes because
    # of its `rejectattr('has_branding')` term. Drop that term and TC13 goes red.
    - name: "[TC13] A branding-less hub pulls in the unsuffixed gate"
      ansible.builtin.assert:
        that:
          - "'wait-for-branding' in tc13_included"
          - "'wait-for-branding-farhub' in tc13_included"
          - "'wait-for-branding-splithub' not in tc13_included"
        fail_msg: "gates included: {{ tc13_included | select('search', 'wait-for-branding') | list }}"

    # And the mirror image, which is where the portal can break: regions with no
    # collectory and no bie-hub means base.yml.j2 includes no gate at all, so the
    # fragment must not emit the dependency either.
    - name: "[TC14] Render regions alone, portal-style"
      ansible.builtin.template:
        src: ../../roles/la-compose/templates/docker-compose/services/regions.yml.j2
        dest: "{{ tc13_dir.path }}/tc14-regions.yml"
        mode: "0644"
      vars:
        services_enabled: ['regions']

    - name: "[TC14] No gate included means no dependency emitted"
      ansible.builtin.assert:
        that:
          - (lookup('file', tc13_dir.path ~ '/tc14-regions.yml') | from_yaml).services.regions.depends_on is not defined
        fail_msg: >-
          regions depends on a branding gate the base would not include:
          {{ lookup('file', tc13_dir.path ~ '/tc14-regions.yml') }}

    # TC13's splithub edge is satisfied in that render because the portal itself runs
    # bie-hub. Isolate the hub term: a portal with neither collectory nor bie-hub, hosting
    # one branding-less hub, must STILL include the unsuffixed gate -- that hub's records
    # fragment depends on it unconditionally.
    - name: "[TC15] Render the base for a portal that only runs records"
      ansible.builtin.template:
        src: ../../roles/la-compose/templates/docker-compose/base.yml.j2
        dest: "{{ tc13_dir.path }}/tc15-base.yml"
        mode: "0644"
      vars:
        services_enabled: ['ala_hub']

    - name: "[TC15] The branding-less hub alone pulls the gate in"
      ansible.builtin.assert:
        that:
          - "'./infrastructure/wait-for-branding.yml' in tc15_includes"
          - "'./services/biocache-hub-splithub.yml' in tc15_includes"
        fail_msg: >-
          biocache-hub-splithub depends on wait-for-branding but the base would not
          include it: {{ tc15_includes }}
      vars:
        tc15_includes: >-
          {{ lookup('file', tc13_dir.path ~ '/tc15-base.yml').splitlines()
             | map('regex_search', '^\s+- (\./.*\.yml)$', '\1')
             | reject('none') | map('first') | list }}

    # The bake target names are computed twice, in two languages: once in Ansible for
    # the `docker buildx bake <targets>` command line, once in Jinja inside
    # docker-bake.hcl.j2. Build #387 died on "failed to find target branding1" -- after
    # the three hosts had already been wiped -- because they disagreed. Assert they
    # cannot.
    - name: "[TC16] Two brandings staged: the portal's and a hub's"
      ansible.builtin.include_tasks: ../../roles/la-compose/tasks/branding-bake-targets.yml
      vars:
        branding_render_list: &tc16_list
          - {suffix: '', source: ../lademo-branding, is_git: false,
             build_source: local, git_ref: HEAD, version: latest}
          - {suffix: '-lademohub', source: 'https://github.com/living-atlases/base-branding',
             is_git: true, build_source: git, git_ref: main, version: latest}

    - name: "[TC16] Render the bake file from the same list"
      ansible.builtin.template:
        src: ../../roles/la-compose/templates/docker-bake.hcl.j2
        dest: "{{ tc13_dir.path }}/docker-bake.hcl"
        mode: "0644"
      vars:
        branding_render_list: *tc16_list
        docker_compose_data_dir: /data/docker-compose

    - name: "[TC16] Every target asked for is a target the file defines"
      ansible.builtin.assert:
        that:
          - branding_bake_targets == ['branding', 'branding_lademohub']
          - branding_bake_targets | difference(tc16_defined) | length == 0
        fail_msg: >-
          bake would fail: asked for {{ branding_bake_targets }}, file defines
          {{ tc16_defined }}
        success_msg: "{{ branding_bake_targets | join(' ') }}"
      vars:
        tc16_defined: >-
          {{ lookup('file', tc13_dir.path ~ '/docker-bake.hcl').splitlines()
             | map('regex_search', '^target "([^"]+)"', '\1')
             | reject('none') | map('first') | list }}

    # And the shape a deployment with no hubs takes: one target, named exactly as before.
    - name: "[TC16] No staged branding falls back to the single portal target"
      ansible.builtin.include_tasks: ../../roles/la-compose/tasks/branding-bake-targets.yml
      vars:
        branding_render_list: []

    - name: "[TC16] assert the fallback"
      ansible.builtin.assert:
        that: branding_bake_targets == ['branding']
        fail_msg: "fallback drifted: {{ branding_bake_targets }}"

    - name: "[TC13-14] Clean up"
      ansible.builtin.file:
        path: "{{ tc13_dir.path }}"
        state: absent

    # ------------------------------------------------------------------ TC17
    # Cross-host path-split vhost stubs (roles/la-compose/tasks/
    # register-shared-vhost-stubs.yml), fed by nginx_remote_shared_members
    # (the shape generate-compose.yml's own resolution produces — see its
    # "Resolve cross-host shared-vhost membership" task). Two members of the
    # SAME shared hostname, owned by two different remote hosts: asserts the
    # stub nginx_paths this host would build to proxy the paths it does not
    # own — static_upstream, a plain http:// proxy_pass straight at the
    # owner's published container port, and proxy_hostname carrying the
    # shared hostname (the Host header the backend needs to see).
    - name: "[TC17] Fabricate a two-member cross-host shared-vhost split"
      ansible.builtin.set_fact:
        nginx_remote_shared_members:
          - {hostname: portal-shared.l-a.site, service_key: bie-hub, pkg: '',
             path: /species, owner_private_ip: 10.77.0.2, container_port: 18280}
          - {hostname: portal-shared.l-a.site, service_key: regions, pkg: '',
             path: /regions, owner_private_ip: 10.77.0.2, container_port: 18380}

    - name: "[TC17] Build the stub nginx_paths (the SAME file the real render includes)"
      ansible.builtin.include_tasks: ../../roles/la-compose/tasks/build-shared-vhost-stub-paths.yml

    - name: "[TC17] The stub carries one path entry per remote member, correctly shaped"
      ansible.builtin.assert:
        that:
          - nginx_remote_stub_paths.keys() | list == ['portal-shared.l-a.site']
          - tc17_paths | length == 2
          - tc17_paths | map(attribute='static_upstream') | unique | list == [true]
          - tc17_paths | map(attribute='is_proxy') | unique | list == [true]
          - tc17_paths | map(attribute='proxy_hostname') | unique | list == ['portal-shared.l-a.site']
          - "'http://10.77.0.2:18280/species' in (tc17_paths | map(attribute='proxy_pass') | list)"
          - "'http://10.77.0.2:18380/regions' in (tc17_paths | map(attribute='proxy_pass') | list)"
        fail_msg: "stub nginx_paths drifted: {{ tc17_paths }}"
        success_msg: "{{ tc17_paths | map(attribute='proxy_pass') | list }}"
      vars:
        tc17_paths: "{{ nginx_remote_stub_paths['portal-shared.l-a.site'] }}"

    # ------------------------------------------------------------------ TC18
    # Gatus duplicate-endpoint crash (TASK-42): a shared-vhost stub proxies to a path a
    # SIBLING host owns, and that sibling already registers its own gatus check for the
    # exact same hostname+path (gatus/templates/http.j2 keys the endpoint on those, not
    # on appname). If the stub's own nginx_vhost call also monitored it, gatus would see
    # two endpoints with the same name+group and crash-loop
    # ("... name and group combination must be unique"). register-shared-vhost-stubs.yml
    # fixes this with `use_gatus: false` on that include_role call — but that only works
    # because role/include_role params outrank a `set_fact` fact in Ansible's variable
    # precedence, which generate-compose.yml relies on for every OTHER nginx_vhost call
    # (its "Set use_gatus fact" task sets it globally once, and real vhost registrations
    # never pass use_gatus themselves). Proven here with a real include_role — not
    # include_tasks, whose task-level vars sit BELOW a fact in precedence and would prove
    # nothing — against the fixture role in molecule/multihub/roles/tc18_gatus_stub,
    # which mirrors nginx_vhost's own gatus task exactly.
    - name: "[TC18] Set the global use_gatus fact the same way generate-compose.yml does"
      ansible.builtin.set_fact:
        use_gatus: true

    - name: "[TC18] Marker paths for the override and no-override cases"
      ansible.builtin.set_fact:
        tc18_override_marker: "/tmp/tc18-gatus-override-{{ 999999999 | random }}.marker"
        tc18_inherited_marker: "/tmp/tc18-gatus-inherited-{{ 999999999 | random }}.marker"

    - name: "[TC18] Stub call: use_gatus:false passed as an include_role param"
      ansible.builtin.include_role:
        name: tc18_gatus_stub
      vars:
        use_gatus: false
        tc18_marker_path: "{{ tc18_override_marker }}"

    - name: "[TC18] Real-owner call: no use_gatus override, inherits the global fact"
      ansible.builtin.include_role:
        name: tc18_gatus_stub
      vars:
        tc18_marker_path: "{{ tc18_inherited_marker }}"

    - name: "[TC18] Stat both markers"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ tc18_override_marker }}"
        - "{{ tc18_inherited_marker }}"
      register: tc18_stat

    - name: "[TC18] The stub's explicit false wins over the global fact; the real owner still gets monitored"
      ansible.builtin.assert:
        that:
          - not tc18_stat.results[0].stat.exists
          - tc18_stat.results[1].stat.exists
        fail_msg: "use_gatus precedence drifted: override exists={{ tc18_stat.results[0].stat.exists }}, inherited exists={{ tc18_stat.results[1].stat.exists }}"

    - name: "[TC18] Clean up markers"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ tc18_override_marker }}"
        - "{{ tc18_inherited_marker }}"

    # ------------------------------------------------------------------ TC19
    # Static guard on the actual fix: TC18 proves the Ansible mechanism works, but
    # nothing stops someone from later "cleaning up" register-shared-vhost-stubs.yml
    # and dropping the `use_gatus: false` that makes it apply. Content-check the real
    # file rather than re-run it, since running the real nginx_vhost role needs root,
    # a live nginx and a gatus group this scenario does not have.
    - name: "[TC19] Read register-shared-vhost-stubs.yml"
      ansible.builtin.set_fact:
        tc19_stub_task_source: "{{ lookup('file', playbook_dir + '/../../roles/la-compose/tasks/register-shared-vhost-stubs.yml') }}"

    - name: "[TC19] The stub's nginx_vhost call opts out of gatus monitoring, and stale checks are cleaned up"
      ansible.builtin.assert:
        that:
          - "'use_gatus: false' in tc19_stub_task_source"
          - "'-remote-http.yaml' in tc19_stub_task_source"
          - "'state: absent' in tc19_stub_task_source"
        fail_msg: >-
          register-shared-vhost-stubs.yml no longer opts its stub out of gatus
          monitoring (TASK-42 regression: the real owner's check and the stub's
          would collide again under the same hostname+path, crash-looping gatus).
