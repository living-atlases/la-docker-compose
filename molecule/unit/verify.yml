---
# All assertions are in converge.yml (facts don't persist across plays in delegated driver).
# This verify play confirms the test host is reachable and summarises the result.
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: All unit assertions passed in converge
      ansible.builtin.debug:
        msg: "PASS: normalize-hostnames (TC1-4) and health gate budget (TC5a-b) completed in converge.yml"
