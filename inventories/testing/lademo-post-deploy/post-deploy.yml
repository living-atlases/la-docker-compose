- name: Post-deploy tasks
  # One host per physical server (see la_pre_deploy_hosts): machine-level tasks
  # (apt installs) must not run once per service alias of the same VM in
  # parallel, or they race on the dpkg/debconf locks.
  hosts: la_pre_deploy_hosts
  roles:
    - post_deploy
  become: yes

- name: Post-deploy postfix tasks
  # One machine per physical server hosting biocache-hub/cas-servers/
  # alerts-service/doi-service (see la_postfix_hosts in the inventory):
  # postfix is machine-level, installing it once per service alias in
  # parallel races on the dpkg locks.
  hosts: la_postfix_hosts

  vars:
    postfix_aliases:
      - user: root
        alias: noreply@l-a.site
    postfix_relayhost: mail.l-a.site
    postfix_relaytls: true
    postfix_sasl_user: 'noreply@l-a.site'
    postfix_sasl_password: 'SOME_PASSWORD'
    postfix_relayhost_port: 587
    postfix_smtpd_relay_restrictions: ['permit_mynetworks', 'permit_sasl_authenticated', 'defer_unauth_destination']
  roles:
    - { role: oefenweb.postfix, tags: ["post-task-postfix"] }
  become: yes
