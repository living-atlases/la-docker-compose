[all]
la-mh-3.ala_hub_lademohub2 ansible_host=la-mh-3
la-mh-1.branding_lademohub2 ansible_host=la-mh-1

[biocache-hub-lademohub2]

la-mh-3.ala_hub_lademohub2

[hub-lademohub2:children]

biocache-hub-lademohub2

[biocache-hub:children]
biocache-hub-lademohub2

[hub-lademohub2:vars]
# Prioritize this over portal other vars
ansible_group_priority = 10

# used in biocache and bie hubs
biocache_query_context = data_hub_uid:dh2

# used in regions
enable_query_context = true
query_context = data_hub_uid:dh2
hub_filter = data_hub_uid:dh2
enable_hub_data = true

orgNameLong = LA Demo Hub 2
orgNameShort = Hub2

header_and_footer_baseurl = https://branding.l-a.site/brand-2023
header_and_footer_version = 2

orgCity = Camberra
orgStateProvince = ACT
orgPostcode = 2601
orgCountry = World

orgPhone=
orgFax=
org_url = https://branding.l-a.site
skin_home_url = https://branding.l-a.site
ala_base_url = https://branding.l-a.site

###### favicon #######
favicon_url=https://raw.githubusercontent.com/living-atlases/artwork/master/favicon.ico
skin_favicon=https://raw.githubusercontent.com/living-atlases/artwork/master/favicon.ico

biocache_hub_hostname = records-hub2.l-a.site
biocache_hub_url = https://records-hub2.l-a.site
biocache_hub_base_url = https://records-hub2.l-a.site
biocache_hub_context_path = 
biocache_base_url = https://records-hub2.l-a.site
biocache_url = https://records-hub2.l-a.site

use_ala_bie=false
use_ala_image_service=true
use_ala_spatial_portal=true


explore_your_area_lat = 7.874575060529807
explore_your_area_lng = 4.449218749999986
explore_your_area_location = World

map_default_latitude = 7.874575060529807
map_default_longitude = 4.449218749999986
map_default_zoom = 5
zoom_outside_scoped_region = false

skin_taxa_links_base_url = https://species.l-a.site/species/

grouped_facets_json=grouped_facets_default.json
biocache_grouped_facets_url=file:///data/ala-hub/config/grouped_facets_default.json
# For customization override this:
# grouped_facets_json = {{inventory_dir}}/files/grouped_facets_lademohub2.json
# overlays_json = {{inventory_dir}}/files/overlays-lademohub2.json

# BIE blacklist - use portal's blacklist file
blacklist_file = ../lademo-inventories/blacklist-prod.json

ssl_certificate_server_dir=/etc/letsencrypt/live/l-a.site
ssl_cert_file=fullchain.pem
ssl_key_file=privkey.pem

# End of common hub vars

[branding-lademohub2:vars]

branding_hostname = la-mh-1
branding_url = branding.l-a.site
branding_path = /brand-2023
branding_appname = branding-lademohub2

[biocache-hub-lademohub2:vars]
ansible_group_priority = 10
# the configuration will generated in /data/lademohub2-hub to avoid possible conflicts with other
# biocache services in a same server
biocache_hub = lademohub2-hub
biocache_hub_artifact = ala-hub
skin_layout = ala
# Each hub is its own container, so nginx proxies to it by container name. The
# config file keeps its host name here and docker mounts it onto the name the
# stock image expects, which is why no *_config override is needed.
biocache_hub_docker_host = la_biocache-hub-lademohub2

