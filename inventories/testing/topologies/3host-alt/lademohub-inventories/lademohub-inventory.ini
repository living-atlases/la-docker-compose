[all]
la-mh-3.ala_hub_lademohub ansible_host=la-mh-3
la-mh-1.branding_lademohub ansible_host=la-mh-1
la-mh-3.ala_bie_lademohub ansible_host=la-mh-3
la-mh-3.regions_lademohub ansible_host=la-mh-3

[biocache-hub-lademohub]

la-mh-3.ala_hub_lademohub

[branding-lademohub]

la-mh-1.branding_lademohub

[bie-hub-lademohub]

la-mh-3.ala_bie_lademohub

[regions-lademohub]

la-mh-3.regions_lademohub

[hub-lademohub:children]

biocache-hub-lademohub
branding-lademohub
bie-hub-lademohub
regions-lademohub

[branding:children]
branding-lademohub
[biocache-hub:children]
biocache-hub-lademohub
[bie-hub:children]
bie-hub-lademohub
[regions:children]
regions-lademohub

[hub-lademohub:vars]
# Prioritize this over portal other vars
ansible_group_priority = 10

# used in biocache and bie hubs
biocache_query_context = data_hub_uid:dh3

# used in regions
enable_query_context = true
query_context = data_hub_uid:dh3
hub_filter = data_hub_uid:dh3
enable_hub_data = true

orgNameLong = LA Demo Hub
orgNameShort = Hub

header_and_footer_baseurl = https://hub.l-a.site
header_and_footer_version = 2

orgCity = Camberra
orgStateProvince = ACT
orgPostcode = 2601
orgCountry = World

orgPhone=
orgFax=
org_url = https://hub.l-a.site
skin_home_url = https://hub.l-a.site
ala_base_url = https://hub.l-a.site

###### favicon #######
favicon_url=https://raw.githubusercontent.com/living-atlases/artwork/master/favicon.ico
skin_favicon=https://raw.githubusercontent.com/living-atlases/artwork/master/favicon.ico

biocache_hub_hostname = records-hub.l-a.site
biocache_hub_url = https://records-hub.l-a.site
biocache_hub_base_url = https://records-hub.l-a.site
biocache_hub_context_path = 
biocache_base_url = https://records-hub.l-a.site
biocache_url = https://records-hub.l-a.site

use_ala_bie=true
use_ala_image_service=true
use_ala_spatial_portal=true

bie_hub_base_url = https://species-hub.l-a.site
bie_hub_hostname = species-hub.l-a.site
bie_hub_context_path = 
bie_base_url = https://species-hub.l-a.site
regions_base_url = https://regions-hub.l-a.site
regions_hostname = regions-hub.l-a.site
regions_context_path = 

explore_url = https://records-hub.l-a.site/explore/your-area/
regions_explore_url = https://regions-hub.l-a.site
regions_map_bounds = [73.04121154664902, -171.10156250000003, -57.29206142558941, 180]
# Only used in regions
biocache_records_url = https://records-hub.l-a.site

explore_your_area_lat = 7.874575060529807
explore_your_area_lng = 4.449218749999986
explore_your_area_location = World

map_default_latitude = 7.874575060529807
map_default_longitude = 4.449218749999986
map_default_zoom = 5
zoom_outside_scoped_region = false

skin_taxa_links_base_url = https://species-hub.l-a.site/species/

grouped_facets_json=grouped_facets_default.json
biocache_grouped_facets_url=file:///data/ala-hub/config/grouped_facets_default.json
# For customization override this:
# grouped_facets_json = {{inventory_dir}}/files/grouped_facets_lademohub.json
# overlays_json = {{inventory_dir}}/files/overlays-lademohub.json

# BIE blacklist - use portal's blacklist file
blacklist_file = ../lademo-inventories/blacklist-prod.json

ssl_certificate_server_dir=/etc/letsencrypt/live/l-a.site
ssl_cert_file=fullchain.pem
ssl_key_file=privkey.pem

# End of common hub vars

[branding-lademohub:vars]

branding_hostname = la-mh-1
branding_url = hub.l-a.site
branding_path = /
branding_appname = branding-lademohub

[biocache-hub-lademohub:vars]
ansible_group_priority = 10
# the configuration will generated in /data/lademohub-hub to avoid possible conflicts with other
# biocache services in a same server
biocache_hub = lademohub-hub
biocache_hub_artifact = ala-hub
skin_layout = ala
# Each hub is its own container, so nginx proxies to it by container name. The
# config file keeps its host name here and docker mounts it onto the name the
# stock image expects, which is why no *_config override is needed.
biocache_hub_docker_host = la_biocache-hub-lademohub

[bie-hub-lademohub:vars]
ansible_group_priority = 10
# the configuration will generated in /data/lademohub-bie-hub to avoid possible conflicts with other
# bie services in a same server
bie_hub = lademohub-bie-hub
bie_hub_artifact = "{{ 'ala-bie-hub' if bie_hub_version is version('2', '>=') else 'ala-bie' }}"
bie_skin_layout = ala
# appname is host-global: it names the gatus check file and the vhost fragment
# suffix, so two hubs on one host need distinct ones.
bie_hub_appname = lademohub-bie-hub
bie_hub_upstream_host = la_bie-hub-lademohub

[regions-lademohub:vars]
ansible_group_priority = 10
# the configuration will generated in /data/lademohub-regions to avoid possible conflicts with other
# regions services in a same server
regions = lademohub-regions
regions_artifact = regions
regions_appname = lademohub-regions
regions_upstream_host = regions-lademohub
nginx_upstream_host = regions-lademohub
# menu_config_json = {{inventory_dir}}/files/menu-config-lademohub.json

regions_skin_layout = "{{ 'ala-main' if regions_version is version('3.4', '>=') else 'main' }}"

# TODO bie and biocache base url is different

