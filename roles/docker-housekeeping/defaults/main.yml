---
# Host-level disk housekeeping for Docker hosts.
#
# Deliberately NOT part of the `docker` role: site.yml gates that role behind
# manage_docker_daemon, which is false on every redeploy over a live stack. A
# host that is already running would therefore never receive these rules — which
# is exactly the situation that filled gbif-es-docker-prod-2026-{1,3} to 100%.
# Nothing here restarts the Docker daemon, so it is safe on every run.

# Container log rotation, as a safety net under the daemon-level log-opts in the
# `docker` role. copytruncate keeps the container's open file descriptor valid,
# so running containers are never touched.
docker_housekeeping_logrotate_enabled: true
docker_housekeeping_logrotate_size: 100M
docker_housekeeping_logrotate_rotate: 3

# ...and a timer to actually enforce that size. `size 100M` only means anything when
# logrotate runs, and the distro runs it once a day, so between two passes a single
# container grows unbounded: on 2026-08-07 la_logger-service reached 615 MB and
# la_spatial-service 476 MB in a day, taking both prod hosts from 78% to 91% full.
# A crash-looping service writes the same stack trace at ~50 MB/h — the daily pass is
# two orders of magnitude too slow for that. Hourly caps a container at roughly
# size + rotate compressed copies.
#
# Its own state file: sharing /var/lib/logrotate/status with the distro's daily run
# would make each pass see the other's rotation as "already done today" and skip the
# file entirely, which is worse than not having the timer.
docker_housekeeping_logrotate_timer_enabled: true
docker_housekeeping_logrotate_oncalendar: hourly
docker_housekeeping_logrotate_state: /var/lib/logrotate/docker-containers.status

# Image-layer GC. With the containerd snapshotter, layers live in
# /var/lib/containerd (12-15 GB on the prod hosts), not /var/lib/docker/overlay2.
# Runs as a systemd timer rather than a deploy step: in production
# enforce-production-safety.yml rejects destructive flags, and pruning mid-deploy
# would race with images the deploy is about to use.
docker_housekeeping_gc_enabled: true
docker_housekeeping_gc_keep: 168h
docker_housekeeping_gc_oncalendar: "*-*-* 02:00:00"
# Touched by la-compose for the length of a deploy (pull to health gate); the GC skips
# its run while the marker is younger than the max age.
docker_housekeeping_deploy_marker: /run/la-compose-deploy.marker
docker_housekeeping_deploy_marker_max_age_min: 360

# Journal cap. ~390 MB per host with no declared ceiling.
docker_housekeeping_journal_enabled: true
docker_housekeeping_journal_max_use: 200M

# Disk-usage metric for Gatus. Gatus cannot read a host filesystem, so a timer
# writes the number and nginx serves it on an internal-only port (see
# docker_metrics_port in the la-compose role). Nothing here is published.
docker_housekeeping_metrics_enabled: true
docker_housekeeping_metrics_interval: 5min
docker_housekeeping_metrics_dir: "{{ nginx_conf_dir | default(docker_compose_data_dir | default('/data/docker-compose') ~ '/nginx') }}/metrics"

# Weekly CVE scan of the images this host is running (Trivy). 2026-10-17: a manual
# scan found geonetwork:3.4.4 -- this repo's default -- shipping Log4Shell (log4j-core
# 2.7 with JndiLookup), public on a production portal for years with nothing looking.
#
# Report, never act and never publish:
#   - the report stays in docker_housekeeping_trivy_cache_dir (0700 root). Nothing is
#     served by nginx and there is no Gatus check: Gatus is usually public, and a red
#     "vulnerabilities" endpoint tells an attacker which host to look at;
#   - the admin gets ONE mail when a CISA KEV (known exploited) CVE appears that was
#     not mailed before, or when the scan starts failing. Same findings next week: silence;
#   - nothing is scanned or pulled during the play. An optional download that fails
#     takes the host out of the play and cascades to the others (#355); the first scan
#     is the timer's (or the CI's `Trivy scan` stage).
#
# Opt out on hosts with no egress to the vulnerability DBs (ghcr.io / mirror.gcr.io), or
# point the two *_db_repository variables at a mirror.
docker_housekeeping_trivy_enabled: true
# By digest, from the official image. The scanner mounts the Docker socket read-only to
# read local images, which is root-equivalent on the host whatever the :ro says: the
# digest pin is what makes that acceptable.
docker_housekeeping_trivy_image: "aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
docker_housekeeping_trivy_db_repository: ""
docker_housekeeping_trivy_java_db_repository: ""
# Vulnerability DB + Java DB (~3 GB together on the CI hosts; needed to see jars in WEB-INF/lib, which
# is where log4j was). Outside /data and /var/lib/docker so CLEAN_MACHINE does not make
# every CI build download them again.
docker_housekeeping_trivy_cache_dir: /var/cache/trivy
# Skip the scan (status "skipped" in the report, UNSTABLE in CI) below this much free
# space: the DBs are ~3 GB and a full root disk is what blocks deploys (the pre-deploy
# disk assert) and took the cluster down on 2026-08-04.
docker_housekeeping_trivy_min_free_gb: 8
# Not on the GC's 02:00, and spread so a cluster does not hit the DB mirrors at once.
docker_housekeeping_trivy_oncalendar: "Sun *-*-* 04:00:00"
docker_housekeeping_trivy_randomized_delay: 2h
# HIGH too: KEV entries are not all CRITICAL. critical_fixable counts CRITICAL only.
docker_housekeeping_trivy_severity: "HIGH,CRITICAL"
docker_housekeeping_trivy_timeout: 30m
docker_housekeeping_trivy_kev_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
# Findings that do not apply, each with its reason. Matched after the scan, on the CVE id
# or on the package name.
docker_housekeeping_trivy_ignore_ids:
  # Tomcat partial-PUT RCE: needs the default servlet writable (readonly=false), which is
  # not Tomcat's default and no LA image sets. Hits ~28 LA images.
  - CVE-2025-24813
docker_housekeeping_trivy_ignore_pkgs:
  # Kernel headers inside an image (kartoza/geoserver ships them): the container runs on
  # the host's kernel, so these are the host's problem, not the image's.
  - linux-libc-dev
docker_housekeeping_trivy_ignore_ids_extra: []
docker_housekeeping_trivy_ignore_pkgs_extra: []

# Who hears about it. Empty recipient = no mail, a warning in the journal instead.
docker_housekeeping_trivy_mail_to: "{{ support_email | default('') }}"
docker_housekeeping_trivy_mail_from: "{{ email_sender | default(docker_housekeeping_trivy_mail_to) }}"
# The same mail path the portal already uses, sent from a throwaway container on the
# compose network (the host itself does not resolve postfix/mailhog):
#   - development: mailhog:1025, like every service;
#   - production: the relay downloads (biocache, mail_smtp_host) or auth (userdetails,
#     mail_host) already mail through. Normally that is the postfix container on every
#     host, relaying via email_sender_server (TASK-65); an external SMTP named in the
#     inventory is used as-is.
docker_housekeeping_trivy_mail_external: >-
  {{ [mail_smtp_host | default(''), mail_host | default('')]
     | reject('in', ['', 'localhost', '127.0.0.1', 'postfix', 'mailhog']) | list }}
docker_housekeeping_trivy_mail_smtp_host: >-
  {{ 'mailhog' if (docker_mail_development_mode | default(false) | bool)
     else (docker_housekeeping_trivy_mail_external | first
           if docker_housekeeping_trivy_mail_external | length > 0 else 'postfix') }}
docker_housekeeping_trivy_mail_smtp_port: >-
  {{ 1025 if (docker_mail_development_mode | default(false) | bool)
     else (mail_smtp_port | default(25)
           if (docker_housekeeping_trivy_mail_smtp_host | trim) == (mail_smtp_host | default(''))
     else (mail_port | default(mail_smtp_port | default(25))
           if (docker_housekeeping_trivy_mail_smtp_host | trim) == (mail_host | default(''))
     else 25)) }}
docker_housekeeping_trivy_mail_network: "la_{{ docker_network | default('internal') }}"
docker_housekeeping_trivy_curl_image: "curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6"
