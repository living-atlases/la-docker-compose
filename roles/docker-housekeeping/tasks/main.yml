---
# Keep a Docker host's root filesystem from filling up on its own.
#
# Every task here is safe on a live stack: nothing restarts the Docker daemon and
# nothing touches container data. That is the whole point of it being a separate
# role — see defaults/main.yml.

- name: housekeeping | logrotate is present
  ansible.builtin.package:
    name: logrotate
    state: present
  when: docker_housekeeping_logrotate_enabled | bool
  tags:
    - docker-housekeeping
    - logrotate

- name: housekeeping | rotate container json logs
  ansible.builtin.template:
    src: docker-containers.logrotate.j2
    dest: /etc/logrotate.d/docker-containers
    owner: root
    group: root
    mode: "0644"
  when: docker_housekeeping_logrotate_enabled | bool
  tags:
    - docker-housekeeping
    - logrotate

- name: housekeeping | state directory for the logrotate timer exists
  ansible.builtin.file:
    path: "{{ docker_housekeeping_logrotate_state | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - docker_housekeeping_logrotate_enabled | bool
    - docker_housekeeping_logrotate_timer_enabled | bool
  tags:
    - docker-housekeeping
    - logrotate

- name: housekeeping | install the hourly logrotate systemd units
  ansible.builtin.template:
    src: "docker-logrotate.{{ item }}.j2"
    dest: "/etc/systemd/system/docker-logrotate.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  register: logrotate_units
  when:
    - docker_housekeeping_logrotate_enabled | bool
    - docker_housekeeping_logrotate_timer_enabled | bool
  tags:
    - docker-housekeeping
    - logrotate

- name: housekeeping | reload systemd for the logrotate units
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - docker_housekeeping_logrotate_enabled | bool
    - docker_housekeeping_logrotate_timer_enabled | bool
    - logrotate_units is changed
  tags:
    - docker-housekeeping
    - logrotate

# Skipped under --check for the same reason as the GC timer: the unit only exists
# for real in a live run, so systemd cannot resolve it during a dry run.
- name: housekeeping | enable the hourly logrotate timer
  ansible.builtin.systemd:
    name: docker-logrotate.timer
    enabled: true
    state: started
  when:
    - docker_housekeeping_logrotate_enabled | bool
    - docker_housekeeping_logrotate_timer_enabled | bool
    - not ansible_check_mode
  tags:
    - docker-housekeeping
    - logrotate

# Rotate once now instead of leaving the host up to an hour away from its first
# enforcement — the disk pressure that motivates this is usually already there.
- name: housekeeping | rotate container logs immediately
  ansible.builtin.command: >-
    /usr/sbin/logrotate --state {{ docker_housekeeping_logrotate_state }}
    /etc/logrotate.d/docker-containers
  changed_when: false
  failed_when: false
  when:
    - docker_housekeeping_logrotate_enabled | bool
    - docker_housekeeping_logrotate_timer_enabled | bool
    - not ansible_check_mode
  tags:
    - docker-housekeeping
    - logrotate

- name: housekeeping | journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_housekeeping_journal_enabled | bool
  tags:
    - docker-housekeeping
    - journald

- name: housekeeping | cap the systemd journal
  ansible.builtin.template:
    src: journald-99-la.conf.j2
    dest: /etc/systemd/journald.conf.d/99-la.conf
    owner: root
    group: root
    mode: "0644"
  register: journald_conf
  when: docker_housekeeping_journal_enabled | bool
  tags:
    - docker-housekeeping
    - journald

# Restarting journald is not disruptive to the stack (it is not in the request
# path); the cap only takes effect on the next rotation otherwise.
- name: housekeeping | apply the journal cap
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  when:
    - docker_housekeeping_journal_enabled | bool
    - journald_conf is changed
  tags:
    - docker-housekeeping
    - journald

- name: housekeeping | install the image GC script
  ansible.builtin.template:
    src: containerd-gc.sh.j2
    dest: /usr/local/bin/containerd-gc.sh
    owner: root
    group: root
    mode: "0755"
  when: docker_housekeeping_gc_enabled | bool
  tags:
    - docker-housekeeping
    - containerd-gc

- name: housekeeping | install the image GC systemd units
  ansible.builtin.template:
    src: "containerd-gc.{{ item }}.j2"
    dest: "/etc/systemd/system/containerd-gc.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  register: gc_units
  when: docker_housekeeping_gc_enabled | bool
  tags:
    - docker-housekeeping
    - containerd-gc

- name: housekeeping | reload systemd for the GC units
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - docker_housekeeping_gc_enabled | bool
    - gc_units is changed
  tags:
    - docker-housekeeping
    - containerd-gc

# Skipped under --check: the unit file is only written for real in a live run, so
# systemd cannot resolve containerd-gc.timer and the whole dry-run fails on a
# host where nothing is actually wrong.
- name: housekeeping | enable the daily image GC
  ansible.builtin.systemd:
    name: containerd-gc.timer
    enabled: true
    state: started
  when:
    - docker_housekeeping_gc_enabled | bool
    - not ansible_check_mode
  tags:
    - docker-housekeeping
    - containerd-gc

- name: housekeeping | metrics directory exists
  ansible.builtin.file:
    path: "{{ docker_housekeeping_metrics_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_housekeeping_metrics_enabled | bool
  tags:
    - docker-housekeeping
    - disk-metrics

- name: housekeeping | install the disk metric publisher
  ansible.builtin.template:
    src: disk-metrics.sh.j2
    dest: /usr/local/bin/disk-metrics.sh
    owner: root
    group: root
    mode: "0755"
  when: docker_housekeeping_metrics_enabled | bool
  tags:
    - docker-housekeeping
    - disk-metrics

- name: housekeeping | install the disk metric systemd units
  ansible.builtin.template:
    src: "disk-metrics.{{ item }}.j2"
    dest: "/etc/systemd/system/disk-metrics.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  register: metrics_units
  when: docker_housekeeping_metrics_enabled | bool
  tags:
    - docker-housekeeping
    - disk-metrics

- name: housekeeping | reload systemd for the metric units
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - docker_housekeeping_metrics_enabled | bool
    - metrics_units is changed
  tags:
    - docker-housekeeping
    - disk-metrics

- name: housekeeping | enable the disk metric timer
  ansible.builtin.systemd:
    name: disk-metrics.timer
    enabled: true
    state: started
  when:
    - docker_housekeeping_metrics_enabled | bool
    - not ansible_check_mode
  tags:
    - docker-housekeeping
    - disk-metrics

# Write it once now rather than leaving Gatus red until the first timer tick.
- name: housekeeping | publish the disk metric immediately
  ansible.builtin.command: /usr/local/bin/disk-metrics.sh
  changed_when: false
  when:
    - docker_housekeeping_metrics_enabled | bool
    - not ansible_check_mode
  tags:
    - docker-housekeeping
    - disk-metrics

# Report, don't act. Acting on a full disk mid-play is how the 2026-08-04 outage
# got worse; the preflight assert in validate-pre-deploy.yml is what stops the
# deploy. This is here so the operator sees the number in the play output.
- name: housekeeping | measure root filesystem usage
  ansible.builtin.command: df --output=pcent /
  register: root_usage
  changed_when: false
  # Read-only, and the warning below is the main reason to dry-run this role at
  # all — skipping it under --check leaves stdout_lines empty and the conditional
  # blows up with "No last item, sequence was empty".
  check_mode: false
  tags:
    - docker-housekeeping

- name: housekeeping | warn when the root filesystem is filling up
  ansible.builtin.debug:
    msg: >-
      WARNING: / on {{ inventory_hostname }} is at
      {{ root_usage.stdout_lines | last | trim }} — container logs and image
      layers are the usual cause. Run /usr/local/bin/containerd-gc.sh and check
      `du -sh {{ docker_dir | default('/var/lib/docker') }}/containers`.
  when: (root_usage.stdout_lines | last | trim | regex_replace('%', '') | int) > 80
  tags:
    - docker-housekeeping
