---
# Ensure external named volumes exist for databases with la_ prefix
# This prevents accidental deletion of database data

- name: "Database volumes: Set Docker socket path"
  ansible.builtin.set_fact:
    docker_socket: "{{ lookup('env', 'DOCKER_HOST') | default('unix:///var/run/docker.sock', true) }}"
  tags:
    - db-init
    - docker-volumes

- name: "Database volumes: Create MySQL external volume"
  community.docker.docker_volume:
    name: la_mysql-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when: enable_mysql | default(false) | bool

- name: "Database volumes: Create PostgreSQL external volume"
  community.docker.docker_volume:
    name: la_postgres-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when: enable_postgres | default(false) | bool

- name: "Database volumes: Create MongoDB external volume"
  community.docker.docker_volume:
    name: la_mongodb-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when: enable_mongo | default(false) | bool

- name: "Database volumes: Create Gatus external volume"
  community.docker.docker_volume:
    name: la_gatus-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when: "'gatus' in (physical_server_groups | default([]))"

- name: "Database volumes: Create Solr external volume"
  community.docker.docker_volume:
    name: la_solr-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when: "'solrcloud' in (physical_server_groups | default([])) or 'solr' in (physical_server_groups | default([]))"

- name: "Database volumes: Create Cassandra external volume"
  community.docker.docker_volume:
    name: la_cassandra-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when: >
    'cassandra5' in (physical_server_groups | default([]))
    or 'cassandra3' in (physical_server_groups | default([]))
    or 'cassandra' in (physical_server_groups | default([]))

- name: "Database volumes: Create Elasticsearch external volume"
  community.docker.docker_volume:
    name: la_elasticsearch-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when: >
    'image-service' in (physical_server_groups | default([]))
    or 'events' in (physical_server_groups | default([]))
    or 'ecodata' in (physical_server_groups | default([]))

- name: "Database volumes: Create doi-service Elasticsearch (ES 7.x sidecar) external volume"
  community.docker.docker_volume:
    name: la_doi-elasticsearch-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when: "'doi-service' in (physical_server_groups | default([]))"

- name: "Database volumes: Create SSL certificates external volume"
  community.docker.docker_volume:
    name: la-site-certs
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  when: use_la_site_certs | default(false) | bool
  tags:
    - db-init
    - docker-volumes

- name: "Database volumes: Create Branding external volume"
  community.docker.docker_volume:
    name: la_branding-assets
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
    - branding
  when: "'branding' in (physical_server_groups | default([]))"

# A data hub that declares a branding_source of its own serves it from its own
# volume, so two hubs never overwrite each other's assets. A hub without one is
# absent from this loop: it reuses the portal's branding through its
# header_and_footer_baseurl.
- name: "Database volumes: Create per data hub branding external volumes"
  community.docker.docker_volume:
    name: "la_branding-assets{{ item.suffix }}"
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  loop: "{{ hub_instances | default([]) | rejectattr('is_portal') | selectattr('use_branding') | list }}"
  loop_control:
    label: "la_branding-assets{{ item.suffix }}"
  tags:
    - db-init
    - docker-volumes
    - branding
