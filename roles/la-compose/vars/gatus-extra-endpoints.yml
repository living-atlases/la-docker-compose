---
# Curated Gatus checks: deep API probes, TLS certificate expiry and DNS resolution.
#
# These are NOT autogenerated from nginx_paths (the nginx_vhost role does that, with a
# simple [STATUS] < 500 condition). They are deeper, hand-picked probes.
#
# Every URL is derived from the DEPLOYMENT'S OWN inventory — never from a hardcoded
# domain. A previous version of this file pinned `gatus_base_domain: "l-a.site"` and
# built URLs as `records-ws.<domain>`; that made every deployment (gbif.es included)
# probe the l-a.site demo over the internet and report its health as its own. Two
# reasons a base domain cannot work here:
#   1. This file is loaded with include_vars (task-vars precedence), so an inventory
#      value could not override it anyway.
#   2. Subdomains are per-project configurable in the toolkit (LAService.suburl /
#      usesSubdomain), so gbif.es uses `datos`/`colecciones`/`registros-ws` where the
#      demo uses `records-ws`/`collections`.
#
# Rendered by: roles/la-compose/templates/docker-compose/gatus/extra-checks.yaml.j2
# → {{ docker_compose_data_dir }}/gatus/config/extra-checks.yaml (Gatus auto-merges it).
#
# The template resolves `gatus_url_sources` against groups[]/hostvars[] and drops any
# service whose inventory group is empty, so undeployed services produce no check at
# all instead of a permanently red one.

# ---------------------------------------------------------------------------
# Where each logical service's public base URL comes from.
#   group     : inventory group; empty/absent -> the service is skipped entirely
#   url_var   : preferred variable, already includes scheme and context path
#               (e.g. spatial_service_url = https://spatial.example.org/ws)
#   host_var  : fallback bare hostname, prefixed with https:// by the template
# ---------------------------------------------------------------------------
gatus_url_sources:
  records-ws:
    group: "biocache-service-clusterdb"
    url_var: "biocache_service_url"
    host_var: "biocache_service_hostname"
  records:
    group: "biocache-hub"
    url_var: "biocache_hub_url"
    host_var: "biocache_hub_hostname"
  species:
    group: "bie-hub"
    url_var: "bie_hub_url"
    host_var: "bie_hub_hostname"
  species-ws:
    group: "bie-index"
    url_var: "bie_index_url"
    host_var: "bie_index_hostname"
  collections:
    group: "collectory"
    url_var: "collectory_url"
    host_var: "collectory_hostname"
  spatial-hub:
    group: "spatial-hub"
    url_var: "spatial_hub_url"
    host_var: "spatial_hub_hostname"
  spatial-ws:
    group: "spatial-service"
    url_var: "spatial_service_url"
    host_var: "spatial_service_hostname"
  geoserver:
    group: "geoserver"
    url_var: "geoserver_url"
    host_var: "geoserver_hostname"
  lists:
    group: "species-list"
    url_var: "specieslist_url"
    host_var: "specieslist_hostname"
  logger:
    group: "logger-service"
    url_var: "logger_url"
    host_var: "logger_hostname"
  namematching:
    group: "namematching-service"
    url_var: "namematching_service_url"
    host_var: "namematching_service_hostname"
  sds:
    group: "sensitive-data-service"
    url_var: "sensitive_data_service_url"
    host_var: "sensitive_data_service_hostname"
  images:
    group: "image-service"
    url_var: "image_service_url"
    host_var: "image_service_hostname"
  alerts:
    group: "alerts-service"
    url_var: "alerts_url"
    host_var: "alerts_hostname"
  doi:
    group: "doi-service"
    url_var: "doi_service_url"
    host_var: "doi_service_hostname"
  regions:
    group: "regions"
    url_var: "regions_base_url"
    host_var: "regions_hostname"
  data-quality:
    group: "data_quality_filter_service"
    url_var: "data_quality_url"
    host_var: "data_quality_filter_service_hostname"
  auth:
    group: "cas-servers"
    url_var: "auth_base_url"
    host_var: "cas_hostname"
  gatus:
    group: "gatus"
    # gatus_url is a bare hostname, not a URL.
    url_var: ""
    host_var: "gatus_url"

# ---------------------------------------------------------------------------
# Framework/server error markers for HTML pages. THE SAME LIST as
# SERVER_ERROR_MARKERS in e2e/cypress/support/checks.ts — keep both in sync, and see
# the note there.
#
# This list exists because the two layers had silently drifted apart: checks.ts claimed
# parity while gatus only looked for "Application error" on the species hub and "An error
# has occurred" on geoserver. The ALA Grails hubs render "An error has occurred", so the
# species check stayed GREEN through a completely broken bie-index -> Solr link, and the
# cypress spec was the only thing that caught it. One list, expanded by the template for
# every endpoint marked `html: true`, so a marker can never again be present in one layer
# and missing from the other.
# ---------------------------------------------------------------------------
gatus_html_error_markers:
  - "HTTP Status 500"
  - "Application error"
  - "An error has occurred"
  - "Whitelabel Error Page"
  - "grails.gsp"

# ---------------------------------------------------------------------------
# Deep API / functional checks — status plus framework error patterns only
# (nothing that depends on a particular deployment's data).
#
# `service` picks the base URL from gatus_url_sources; `path` is appended to it.
# Mind that the resolved base already carries the service context path: for example
# spatial_service_url ends in /ws, so the fields check is just "/fields".
#
# `html: true` appends one `[BODY] != pat(*marker*)` condition per entry of
# gatus_html_error_markers. Use it for anything that serves a rendered page.
#
# A NOTE ON `[STATUS] < 400` ALONE: several ALA services answer 200 with an error
# payload, so the status says nothing. bie-index returns 200 + `{"error": "IOException
# ..."}` when it cannot reach Solr, and biocache returns 200 + `[]` for the index fields
# when it cannot read the schema. Any check whose failure mode is a well-formed 200 needs
# a SHAPE condition (`has(...)`, `len(...)`) on top of the status.
#
# Renderer defaults: conditions=['[STATUS] < 400'], interval=gatus_interval (1m).
# ---------------------------------------------------------------------------
gatus_extra_endpoints:

  # `has(totalRecords)` and not a count: the count belongs in Data checks below. What this
  # adds over a bare status is the ability to tell a working search from a 200 that carries
  # an error document, which is the shape biocache-service returns when its Solr link breaks.
  - name: "records-ws occurrences search"
    group: "Deep checks"
    service: "records-ws"
    path: "/occurrences/search?q=*:*&pageSize=0"
    conditions: ["[STATUS] < 400", "has([BODY].totalRecords) == true"]

  # --- Data checks ---------------------------------------------------------------
  # SEPARATE GROUP ON PURPOSE. These two go red on a portal that simply has no records
  # yet, and that is a legitimate install: a docker-compose portal has no dataResources,
  # runs no e2e suite, and may not even deploy Airflow. verify-deployment.sh gates the
  # build on "Deep checks" only, so nothing here can report a data-less deployment as a
  # failed one. They stay visible on the dashboard because they do describe something an
  # end user would notice — just not something a deploy can fix.
  #
  # What closes them is data plus a restart, which is what scripts/refresh-biocache-fields.sh
  # does after an ingest. See wait-for-solr-collection.yml.j2 for why the restart is
  # unavoidable: biocache-service caches its field list at boot from /admin/luke, which
  # reports nothing for an index with no documents.

  # len() guards the hollow-green case: with an empty field list biocache answers 200
  # with `[]` (two bytes), which a status-only condition happily accepts.
  # CONFIRMED on build #356: gatus evaluates len() on a top-level JSON array as the
  # ELEMENT count, so `[]` scores 0 and the check goes red as intended.
  - name: "records-ws index fields"
    group: "Data checks"
    service: "records-ws"
    path: "/index/fields"
    conditions: ["[STATUS] < 400", "len([BODY]) > 0"]

  # The hub HTML page, the one thing the cypress suite covered and gatus did not.
  # It was filed here as "data-agnostic: an empty index renders a perfectly good
  # 'No records found' page". #356 showed that is not something to rely on: the page
  # 500s on an <alatag:message> NPE inside the hub's message source, and stays that way
  # until the hub is restarted. Whether that is triggered by an empty index or is
  # independent of the data is NOT established (see biocache-hub.yml.j2 for what has
  # been ruled out), so it sits here rather than in "Deep checks": until we know, it
  # must not be able to fail a deploy that simply has no records.
  - name: "records search page"
    group: "Data checks"
    service: "records"
    path: "/occurrences/search?q=*:*"
    html: true

  - name: "species search"
    group: "Deep checks"
    service: "species"
    path: "/search?q=Acacia"
    html: true

  # A healthy bie-index answers with `searchResults`; a broken one answers 200 with
  # `{"error": "IOException ..."}`. Status alone cannot tell them apart.
  # This is a SHAPE check and nothing more -- see the count check below for what it cannot
  # see. It stays in Deep checks because the shape is data-independent: an empty bie index
  # still answers with a well-formed `searchResults`.
  - name: "species-ws name search"
    group: "Deep checks"
    service: "species-ws"
    path: "/search?q=Acacia"
    conditions: ["[STATUS] < 400", "has([BODY].searchResults) == true"]

  # The hollow-green case for species, and the reason this check exists. Verified against
  # the live deployment on 2026-08-25: with a bie index that had never been populated,
  #   GET species-ws/search?q=Acacia  ->  200 {"searchResults":{"totalRecords":0,...}}
  # which passes BOTH conditions of the check above, and passes the Cypress species spec
  # too. Every probe we had was green over an index with no taxa in it at all. Same class
  # as the `[]` field list handled by "records-ws index fields", and the same class as
  # section 1 of living-atlases/la-toolkit#28: a step that reports success and wrote nothing.
  #
  # Data checks ON PURPOSE, exactly like the records ones: a portal with no species data is
  # a legitimate install. Nothing here can fail a deploy -- verify-deployment.sh gates on
  # "Deep checks" alone. What closes it is scripts/e2e-bie-import.sh, or a real taxonomy
  # import from bie-index's own /admin/import.
  #
  # `q=*:*` is the match-all edismax special-cases; `pageSize=0` keeps the body to the
  # counters. Both accepted by bie-index 3.1.0 (verified 2026-08-25 against the live
  # service, which answered with a well-formed body and totalRecords 0 for every form).
  # Re-confirm this returns the full count, not 0, the first time the index has taxa in
  # it -- a match-all that silently matches nothing would put this check right back in the
  # class of hollow probes it exists to close.
  - name: "species-ws taxon count"
    group: "Data checks"
    service: "species-ws"
    path: "/search?q=*:*&pageSize=0"
    conditions: ["[STATUS] < 400", "[BODY].searchResults.totalRecords > 0"]

  # `/ws` on collectory serves the HTML home page, not a web service, so a status-only check
  # here proves only that Grails answered. `html: true` applies the shared error markers, which
  # is what actually distinguishes a working collectory from one rendering a stack trace --
  # the failure mode d81db6d already had to fix once on the hub healthchecks.
  - name: "collections ws"
    group: "Deep checks"
    service: "collections"
    path: "/ws"
    html: true

  # The real web service, and the honest count. Empty on a portal that has registered no
  # data resources, which is a legitimate install, hence Data checks.
  - name: "collections dataResource count"
    group: "Data checks"
    service: "collections"
    path: "/ws/dataResource"
    conditions: ["[STATUS] < 400", "len([BODY]) > 0"]

  - name: "spatial ws fields"
    group: "Deep checks"
    service: "spatial-ws"
    path: "/fields"
    conditions: ["[STATUS] < 400"]

  # /web/ answers 302 to a ;jsessionid= URL; gatus follows redirects by default
  # (client.ignore-redirect is false), so the body condition does see the real page.
  - name: "spatial geoserver"
    group: "Deep checks"
    service: "geoserver"
    path: "/web/"
    html: true

  - name: "lists ws"
    group: "Deep checks"
    service: "lists"
    path: "/ws/speciesList"
    conditions: ["[STATUS] < 400", "has([BODY].listCount) == true"]

  # Measured: a species-list service holding nothing answers
  # `{"listCount":0,"sort":"listName",...,"lists":[]}` with HTTP 200, so the status check
  # above cannot see an empty one. Same shape as the bie index, same treatment.
  - name: "lists count"
    group: "Data checks"
    service: "lists"
    path: "/ws/speciesList"
    conditions: ["[STATUS] < 400", "[BODY].listCount > 0"]

  # The download-reason vocabulary ships with the service, so requiring it to be non-empty is
  # data-independent and belongs in Deep checks: a logger answering `[]` here is broken, not
  # merely unused.
  - name: "logger reasons"
    group: "Deep checks"
    service: "logger"
    path: "/service/logger/reasons"
    conditions: ["[STATUS] < 400", "len([BODY]) > 0"]

  # Status alone is hollow here. Measured: a name the index does not know answers
  # `200 {"success":false,"nameType":"SCIENTIFIC","issues":["noIssue"]}`, so an index that
  # failed to download or unpack passes a status check for every query. The name index is part
  # of the deployment, not user data, so demanding a match stays data-independent.
  - name: "namematching search"
    group: "Deep checks"
    service: "namematching"
    path: "/api/search?q=Acacia"
    conditions: ["[STATUS] < 400", "has([BODY].scientificName) == true"]

# TLS certificate expiry and DNS checks are generated by the template from the same
# resolved URL map (one entry per unique FQDN), so they always track the deployment's
# real hostnames. Tunables live in roles/la-compose/defaults/main.yml:
# gatus_cert_interval, gatus_cert_expiry_threshold, gatus_dns_resolver,
# gatus_dns_interval.
