---
# Docker Compose Role Defaults
# Variables for docker-compose deployment

# ============================================
# Core Configuration
# ============================================

# Deployment type and environment
deployment_type: container  # Fixed for docker-compose
deployment_env: production  # Options: dev, staging, production

# Auto-deploy: Start services after generating config (like traditional ala-install)
auto_deploy: true

# Docker Compose profiles to activate (comma-separated)
# infra: nginx, certs, branding | monitoring: gatus | core-auth: CAS stack | app-core: LA apps | full: all
compose_profiles: "full"

# User for docker operations (uses current user or 'ubuntu' for VM)
# docker_default_user is now defined globally in the inventory [all:vars]

# Skip handlers as we're generating docker-compose files, not deploying to VMs
skip_handlers: true

supported_ansible_version: {full: 2.17.3, major: 2, minor: 17, revision: 3}

# Instance name for docker-compose project identification
# Used for docker compose --project-name and container naming
# Defaults to short hostname for uniqueness per deployment
instance_name: "{{ inventory_hostname_short | default(inventory_hostname) }}"

# ============================================
# i18n Configuration
# ============================================

i18n:
  enabled: true
  strategy: volume
  volume:
    name: ala-i18n-data
    source: init-container

# ============================================
# Docker Compose Container Names
# ============================================

# Fallback for upstream templates (species-list, logger-service) that gate on
# {% if mysql == 'mysql-server-8.0' %}. The `mysql` fact is normally set by
# ala-install/.../common/tasks/setfacts.yml — but only for Ubuntu 14/18/20/22/24.
# On Debian (no matching block) the var stays undefined and template rendering
# fails. Define a fallback so container deployments work on any host OS.
mysql: "mysql-server-8.0"

# MySQL and MongoDB container names
cas_db_hostname: mysql
collectory_db_host_address: mysql
collectory_db_host: mysql
user_store_db_hostname: mysql
apikey_db_hostname: mysql
specieslist_db_hostname: mysql

# MongoDB container names for CAS
ticket_registry_db_hostname: la_mongodb
cas_audit_host: la_mongodb
cas_spring_session_host: la_mongodb
cas_tickets_host: la_mongodb
cas_services_host: la_mongodb

# Audit trail collection, as fixed by Apereo's AuditMongoDbProperties constructor.
cas_audit_collection: MongoDbCasAuditRepository
# Days to keep CAS audit records; 0 disables the TTL index entirely. Off by default:
# the audit trail is personal data and the retention period is each institution's
# policy to set, not ours to impose on the Atlases inheriting this. Enabling it on an
# already-large collection purges the backlog in the background — do it off-peak.
cas_audit_retention_days: 0

# ============================================
# Docker Users
# ============================================

# Container runtime UID/GID - MUST match la-docker-images Dockerfiles
# All ALA service containers run as uid/gid 1000 (hardcoded in la-docker-images)
# This ensures config files created by Ansible can be read by containers
docker_container_uid: 1000
docker_container_gid: 1000

# Service user variables - will be overridden in generate-compose.yml
# These defaults are here for reference but are immediately replaced
tomcat_user: "{{ docker_default_user }}"
cas_user: "{{ docker_default_user }}"
collectory_user: "{{ docker_default_user }}"
userdetails_user: "{{ docker_default_user }}"
apikey_user: "{{ docker_default_user }}"
species_list_user: "{{ docker_default_user }}"

# ============================================
# Directory Configuration
# ============================================

data_dir: /data
docker_compose_data_dir: /data/docker-compose
# Host path where Ansible writes nginx tree (conf.d, sites-*). Container paths in generated
# nginx.conf still come from nginx_conf_path / nginx_vhost_path (typically under /etc/nginx).
nginx_conf_dir: "{{ docker_compose_data_dir }}/nginx"
docker_output_dir: "{{ docker_compose_output_dir | default('docker-compose-output') }}"

# ============================================
# Build Configuration
# ============================================

build_images: true
docker_registry: ""
docker_tag: "{{ collectory_branch | default(collectory_version | default('develop')) }}"
docker_image_tag: "{{ docker_tag }}"
docker_cache_tag: "buildcache"
docker_build_cache_dir: "{{ ansible_env.HOME }}/.cache/docker-buildx"

# ============================================
# Network Configuration
# ============================================

docker_network: internal
docker_network_mtu: 1500
docker_extra_hosts: []
nginx_docker_internal_aliases: []
# The subset of the above this host's nginx genuinely serves. Snapshotted in
# generate-compose.yml before the gatus monitoring FQDNs (cluster-wide) are merged in,
# and it is this list — never the merged one — that decides which extra_hosts entries a
# local vhost may shadow.
nginx_local_server_names: []
docker_socket: unix:///var/run/docker.sock

# Cross-host datastore reachability (VM model, NO swarm).
# When the deployment spans more than one docker_compose host, datastore
# containers (cassandra/solr/zookeeper/mysql/postgres) publish their port on the
# host private IP so remote consumers can reach them via host:port + static DNS
# (extra_hosts). Computed in generate-compose.yml; defaults here keep single-host
# behaviour unchanged (no publishing, bind nothing extra).
publish_db_ports_clusterwide: false
# Private IP this host binds published datastore ports to (overridden in
# generate-compose.yml from hostvars[inventory_hostname].ansible_host).
host_private_ip: "0.0.0.0"

# ============================================
# Java Memory Configuration
# ============================================

tomcat_java_opts: "-Xmx2g -Xms2g -Xss512k -Djava.awt.headless=true"
set_sql_mode: true

# ============================================
# Docker Service Internal Ports
# ============================================

cas_port: 9000
cas_management_port: 8070
userdetails_port: 9001
apikey_port: 9002
collectory_port: 8080
bie_hub_port: 8080
bie_index_port: 8080
biocache_hub_port: 8080
biocache_service_port: 8080
image_service_port: 8080
logger_service_port: 8080
namematching_service_port: 9179
namematching_admin_port: 9180
doi_service_port: 8080
sensitive_data_service_port: 9189
sensitive_data_admin_port: 9190
species_list_port: 8080

# Directory suffix of the Lucene index the sensitive-data-service reads:
# {{ data_dir }}/lucene/namematching-{{ sds_nameindex_datestamp }}. It gets its own directory
# because the inventory points it at its own artifact
# (ala_sensitive_data_service_namematching_source), which need not be the one namematching-service
# installs in .../namematching-nm. Deliberately NOT derived from nameindex_datestamp: that names
# the lucene-6 backbone build the pipelines use, and the SDS artifact is a different one — the
# directory would advertise a Lucene major the index inside does not have.
sds_nameindex_datestamp: sds

# ============================================
# Docker Container Hostnames for Nginx
# ============================================

cas_docker_host: la_cas
userdetails_docker_host: la_userdetails
cas_management_docker_host: la_cas-management
apikey_docker_host: la_apikey
collectory_docker_host: la_collectory
bie_hub_docker_host: la_bie-hub
bie_index_docker_host: la_bie-index
biocache_hub_docker_host: la_biocache-hub
biocache_service_docker_host: la_biocache-service
image_service_docker_host: la_image-service
logger_service_docker_host: la_logger-service
namematching_service_docker_host: la_namematching-service
doi_service_docker_host: la_doi-service
sensitive_data_service_docker_host: la_sensitive-data-service
species_list_docker_host: la_species-list

# The real collection the `biocache` alias points at on a fresh deployment. `biocache`
# itself must be an ALIAS, because that is what the production reindex path swaps:
# Full_index_to_solr builds a dated collection and Update-Collection-Alias repoints the
# alias onto it, and SolrCloud refuses an alias named after an existing collection.
# Fixed (not dated) so re-running init-solr is idempotent; the first real reindex
# replaces it with a dated one.
biocache_seed_collection: biocache-seed

# Airflow (NO-AWS pipelines-airflow overlay): OPT-IN. Set use_airflow=true to deploy
# the overlay (Airflow + MinIO, separate compose project) joined to the `la` network as
# `la_airflow`. Define airflow_hostname (e.g. airflow.l-a.site) to also expose it via
# nginx + gatus. Follows the use_* pattern; promotable to the generator/la-toolkit toggles.
use_airflow: false
airflow_docker_host: la_airflow
airflow_port: 8080

# ============================================
# Service-Specific Configuration
# ============================================

biocache_hub: ala-hub
grouped_facets_json: grouped_facets_ala.json
biocache_hub_tomcat_server_address: "0.0.0.0"

# Docker image tags for namematching/SDS servers. The inventory pins these vars
# to Debian apt-package versions (e.g. 1.2-SNAPSHOT+0~...), which are INVALID as
# Docker tags. The livingatlases/ala-{namematching,sensitive-data}-server images
# only publish a `latest` tag, so default to that. Override per-inventory if a
# real tag is ever published.
namematching_docker_tag: "latest"
sensitive_data_docker_tag: "latest"

# ============================================
# Services Configuration
# ============================================

services_enabled: []

# Lista TEMPORAL de servicios a omitir en el despliegue (nombres de grupo de inventario),
# p.ej. ['sds-static-home','sensitive-data-service']. Vacío = desplegar todo.
# Se pasa por ansiblew -e o por el parámetro SKIP_SERVICES de Jenkins. No tocar inventarios.
skip_services: []

# ============================================
# Nginx Configuration
# ============================================

# Track what ala-install provisions on VMs: its nginx role adds the official nginx.org repo and
# pins apt to it, which serves the stable branch. Measured on ALA production 2026-08-21:
# biocache-ws.ala.org.au = nginx/1.30.4, auth/collections/spatial = 1.31.4 (mainline). We follow
# stable. Staying on 1.25 cost us build #361: cas5 emits add_header_inherit, which needs >= 1.29.3.
docker_nginx_version: "1.30"

# Nginx container paths (override host-specific paths from nginx role)
nginx_user: nginx
nginx_pidfile: /var/run/nginx.pid
nginx_conf_path: /etc/nginx/conf.d
nginx_vhost_path: /etc/nginx/sites-enabled
nginx_mime_file_path: /etc/nginx/mime.types
nginx_error_log: "/var/log/nginx/error.log notice"
nginx_access_log: "/var/log/nginx/access.log main"

# ============================================
# Branding Configuration
# ============================================

# use_branding gates applying the branding (currently only the Spatial Portal skin). Branding is
# non-optional in la-toolkit (LAServiceDesc optional:false), so it is always configured — key off
# branding_source (a cluster-wide inventory var) rather than the PER-HOST services_to_build, so the
# Spatial skin auto-applies on the host that runs spatial-hub (not just the branding-build host). The
# skin auto-detect + deploy guard still fall back to 'portal' if the branding lacks app/spatial/spatial-layout.gsp.
use_branding: "{{ branding_source is defined and branding_source is not none }}"
branding_source: null
branding_url: "branding"
branding_node_version: "18"
branding_version: "latest"
branding_git_ref: "master"
branding_dev_mode: false
branding_dev_port: "3000"
branding_git_watch: false
branding_git_check_interval: "300"

# Spatial Portal skin layout. Auto: use the header base-branding generates (dist/spatial/, mounted
# read-only at /data/spatial-hub/views) when the branding actually ships it, else the stock 'portal'
# layout — so enabling branding never breaks spatial-hub, old or new. Availability is detected in
# generate-compose.yml (spatial_branding_skin_available): automatic for a LOCAL branding source;
# for a git-URL branding set this to 'spatial-layout' explicitly (a deploy-time guard then verifies
# it). An explicit value here always wins. 'generic' = in-WAR layout driven by header_and_footer_baseurl
# (reuses the branding banner/footer, no mount needed).
spatial_hub_skin_layout: "{{ 'spatial-layout' if (spatial_branding_skin_available | default(false) | bool) else 'portal' }}"

# ============================================
# Monitoring
# ============================================

monitoring_enabled: false

# Gatus health-check interval (default 5m in upstream role; tightened for docker-compose dev)
gatus_interval: "1m"

# Not set on purpose, so cas5's own 'off' / 'merge' apply and we get the behaviour upstream
# intends. Only pin this if you drop docker_nginx_version below 1.29.3, where add_header_inherit
# does not exist and nginx refuses to start: then set it to the EMPTY string, not 'off'.
# fragment_73_location.j2 guards on truthiness, so 'off' still emits the directive.

# Gatus "Up" condition fed to the upstream gatus role's http.j2 (default there is
# '[STATUS] == 200'). ALA endpoints behind CAS legitimately return 302/401/403 (and
# param-less API paths 400/404) while healthy, so ==200 produces massive false-reds.
# '< 500' keeps only real outages red (502/503/504/timeout/no upstream).
#
# It cannot be the *only* condition: an unreachable host leaves the status at 0, which
# satisfies '< 500' just as well as a healthy 200. http.j2 therefore pairs whatever is set
# here with '[CONNECTED] == true'; set gatus_up_conditions instead to replace the pair.
gatus_up_condition: "[STATUS] < 500"

# The root path of a vhost is the one place where '< 500' is too generous. A 404 on
# `/` does not mean "this API wants parameters", it means no server_name matched and
# the request reached the wrong machine. On gbif.es that hid a real fault for months:
# extra_hosts pointed registros-ws.gbif.es at a decommissioned 2021 VM, every path
# returned 404, and ~25 checks reported green because 404 < 500. Applies only to the
# vhost root; every other nginx_paths entry keeps gatus_up_condition. Paired with
# '[CONNECTED] == true' the same way — set gatus_root_up_conditions to replace the pair.
gatus_root_up_condition: "[STATUS] < 400"

# Curated extra checks (roles/la-compose/vars/gatus-extra-endpoints.yml, rendered by
# templates/docker-compose/gatus/extra-checks.yaml.j2). Kept in defaults/ — NOT in the
# vars/ file — because vars/ is loaded with include_vars, whose precedence an inventory
# value cannot beat.
#
# Certificate expiry checks: 336h = 14 days of warning. A long interval matters because
# gatus does not retry within a probe, and firing every cert check at once caused
# transient timeouts that read as [CERTIFICATE_EXPIRATION] (0s) -> spurious red.
gatus_cert_interval: "15m"
gatus_cert_expiry_threshold: "336h"

# DNS A-record checks resolve through this server. Defaults to Cloudflare's public
# resolver; point it at your own DNS on private/internal deployments.
gatus_dns_resolver: "1.1.1.1"
gatus_dns_interval: "15m"

# Post-deploy health gate timeout (seconds). validate-post-deploy.yml passes this
# to wait-for-health.sh --timeout. Raised from 300 to accommodate cassandra cold-start:
# start_period 120s + schema load (la_cassandra_init cqlsh) + biocache-service retry
# all need to fit within this window on a clean host.
# Raised 480->720 after #249: with CLEAN_MACHINE wiping the external datastore volumes
# (0d51fc1), the first fresh-volume boot is slower and bie-hub (slow Grails hub whose /
# healthcheck also waits on branding) exceeded 480s -> gate timed out -> converge restarted
# it (counter-productive: reset its warmup) -> build FAILURE. 720s lets bie-hub serve a
# branded 200 without the restart.
health_check_timeout: 720

# Converge-by-retry budget for the same gate. wait-for-health.sh restarts the services
# still 'unhealthy' after the first wait and re-waits, a few bounded rounds, so a cross-host
# startup race (biocache-service caches its Cassandra connection ONCE; bie-hub caches null
# branding ONCE) converges instead of needing a manual restart. The script reads both from
# the environment; validate-post-deploy.yml injects them and derives the timeout(1) budget
# from the SAME values, which is the whole point: before this, the wrapper allowed 780s while
# the script's worst case was 4320s (4 rounds x 900s), so timeout(1) killed the gate at exactly
# 13:00 with rc=124 and converge was dead code. It cost a gbif-es production deploy (2026-08-05).
# 4x900 are the script's own long-standing defaults, kept deliberately. They are not a
# guess: build #315 (the last CLEAN green, 2026-07-30, before 2b28466 introduced the wrapper)
# needed all of it. On a cold boot this stack is routinely unhealthy on first pass and heals
# by restarting -- #315 logged biocache-service/collectory/logger-service converging in round 1
# and bie-hub in round 2, and went green. Build #335 tried the same stack with 2x600 and
# bie-hub failed its round-2 restart, having succeeded at 900s in #315. So the per-round
# timeout is load-bearing at 900, not padding, and lowering it silently turns a green deploy red.
# The ceiling this implies (73 min) is time-to-admit-failure, NOT waiting: wait_for_all_healthy
# returns the moment everything is healthy, and the observed cases converge in 15-30 min.
# Shrinking it is a decision to make after the apps stop needing a restart to boot (see the
# gate/monitoring split), not before.
health_converge_rounds: 4
health_converge_timeout: 900

# Rounds the gate may spend WAITING instead of restarting, when nothing reports 'unhealthy'
# but something is still 'starting'. A restarted Grails hub needs ~5-8 min to boot, so a
# converge round can end with it still 'starting': the next round then finds nothing
# unhealthy to restart and, before this knob existed, gave up on a service that was about to
# come up (build #295, and the converge self-test on a slow agent in #347). These waits are
# bounded separately from the restart rounds so a permanently-'starting' service still fails
# the gate rather than parking the deploy.
health_converge_settle_waits: 2

# Wall-clock budget for the timeout(1) wrapper around the gate, in seconds: the script's
# worst case plus slack for its own startup, the restarts between converge rounds and the
# final diagnostics dump.
# Defined here rather than inlined in the task so it is derived, not transcribed — Jinja in
# defaults resolves lazily, so an inventory that raises health_check_timeout (or either
# converge knob) still gets a wrapper that outlives the script instead of decapitating it.
#
# The slack is per-round, not a flat 60s. Each phase overshoots its nominal timeout by one
# check interval: the loop only re-evaluates its deadline between iterations, so it exits on
# the first check *after* the deadline. The gbif-es run of 2026-08-06 measured 720 + 903 +
# 902 + 901 + 904 = 4330s of waiting against a 4380s wrapper, and `docker compose restart`
# between rounds plus the diagnostics dump ate almost all of the remaining 50s. The dump is
# the only reason that failure was diagnosable at all, and it finished with about a second
# to spare. 30s per round covers the overshoot and the restart; 120s covers startup and the
# dump, which greps logs for every unhealthy container.
#
# The settle waits count as rounds here: each one is another wait_for_all_healthy phase of up
# to health_converge_timeout. Leaving them out would reintroduce exactly the wrapper-vs-script
# drift this variable exists to prevent.
# 720 + (4+2)*900 + (4+2)*30 + 120 = 6420s.
health_gate_budget: >-
  {{ (health_check_timeout | default(300) | int)
     + ((health_converge_rounds | default(2) | int)
        + (health_converge_settle_waits | default(2) | int))
       * (health_converge_timeout | default(600) | int)
     + ((health_converge_rounds | default(2) | int)
        + (health_converge_settle_waits | default(2) | int)) * 30
     + 120 }}

# ============================================
# SSL / Certificates
# ============================================

# Use livingatlases/l-a-site-certs Docker image for demo SSL certs (l-a.site wildcard).
#
# Decided upstream by generator-living-atlas: when the deployment domain (LA_domain)
# is l-a.site or a subdomain, the generated inventory sets use_la_site_certs=true
# (demo wildcard certs); for any other (real) domain it is false, and the deploy
# must provide its own certs via ssl_certificate_server_dir / ssl_cert_file /
# ssl_key_file. An explicit value in the toolkit/inventory always wins.
#
# la-compose performs NO domain detection; generate-compose.yml only normalises
# this to a boolean with a false fallback for hand-written inventories that omit it.
# use_la_site_certs: false
ssl_certificate_server_dir: "/etc/letsencrypt/live"
ssl_cert_file: "fullchain.pem"
ssl_key_file: "privkey.pem"

# Host directory bind-mounted into nginx/cert-validator when the site provides its own
# certificates (use_la_site_certs=false). Empty means "derive it": /etc/letsencrypt when
# ssl_certificate_server_dir lives under it -- so the `live/<domain>/*.pem` symlinks into
# ../../archive/ still resolve inside the container -- and ssl_certificate_server_dir itself
# otherwise. Set it explicitly only for layouts neither rule covers.
ssl_certs_host_mount_dir: ""

# ============================================
# Nginx / Webserver
# ============================================

# Docker deployments always use nginx as the reverse proxy.
webserver_nginx: true
# Suppress warning about undefined nginx_vhost_fragments_to_clear (not needed for docker).
nginx_vhost_fragments_to_clear_no_warning: true

# Docker bridge networks have no IPv6 unless the daemon is explicitly configured for it,
# and nginx does not degrade gracefully: `listen [::]:80` makes it abort at startup with
# "socket() [::]:80 failed (97: Address family not supported by protocol)" and crash-loop.
# The nginx image only strips that line from its own default.conf, not from the vhosts
# nginx_vhost renders. On a VM nginx listens on the host stack and this stays true.
nginx_listen_ipv6: false

# ============================================
# Redeploy safety (production)
# ============================================

# Environment designation: ci | staging | production. In production,
# enforce-production-safety.yml fails the deploy if any destructive flag
# (docker_force_recreate, force_db_init, allow_service_removal,
# docker_desktop_workaround) is set — the operator must drop the flag, there is
# no silent override. Set in the inventory ([all:vars] la_env=production).
la_env: ci

# Whether this run may (re)configure and restart the Docker daemon. site.yml
# sets it automatically: true on a first install (no live la_* stack), false on
# a redeploy over a running stack — because the `docker` role's daemon.json
# rewrite notifies `systemctl restart docker`, which drops every container
# (incl. nginx) for ~20s and breaks the non-destructive redeploy contract
# (CI #316). Force true in a maintenance window if daemon.json must change.
manage_docker_daemon: true

# Remove la_nginx before `compose up`. Only needed on Docker Desktop, whose
# port-forwarder holds :80/:443 bindings after stop. On Linux hosts (CI VMs,
# production) nginx must be left running: config changes are applied with a
# graceful `nginx -s reload` (zero downtime) instead of a container recreate.
docker_desktop_workaround: false

# `docker compose up --remove-orphans` deletes any running container whose
# service disappeared from the generated compose (generation bug, SKIP_SERVICES
# change, incomplete inventory). validate-service-consistency.yml aborts the
# deploy in that case unless this is explicitly set to true for an intentional
# service removal.
allow_service_removal: false

# Restart services whose bind-mounted config content changed since the last
# deploy. The normal-path `docker compose up` runs with --no-recreate (it never
# recreates a live container), and compose never picks up mounted-file content
# changes anyway, so this out-of-band restart is what applies regenerated config
# to already-running services. Snapshots live in
# {{ docker_compose_data_dir }}/.config-hashes/. nginx is excluded (reload).
config_change_restart: true

# Dump MySQL/MongoDB/PostgreSQL (auth users, registry, metadata DBs) before the
# deploy mutates anything — the container equivalent of ala-install's db-backup
# role (mysqldump/pg_dump/mongodump invoked before each service role). Enabled
# by default in production; CI machines are disposable so they skip the cost.
# Big re-generable datastores (Cassandra/Solr/ES) are NOT dumped.
pre_deploy_backup: "{{ (la_env | default('ci')) == 'production' }}"
la_backup_dir: "{{ data_dir }}/backups/pre-deploy"
# How many timestamped backup sets to keep (older ones are pruned).
pre_deploy_backup_keep: 7

# ============================================
# Portal migration (VMs -> Docker)
# ============================================
#
# Two playbooks, run by hand and never part of a normal `ansiblew`:
#   playbooks/portal-migrate-fetch.yml  — read-only, dumps the source VMs
#   playbooks/db-restore.yml            — loads those dumps into this stack
#
# THE CENTRAL RULE IS PER-DATABASE, NEVER CLUSTER-WIDE. `mysqldump
# --all-databases` carries mysql.user, `pg_dumpall` carries roles-with-passwords
# and a `mongorestore` of admin carries the Mongo users — each of which would
# replace the credentials init-databases.yml generated from the inventory, so
# every service would instantly lose its own database auth. Dumping and
# restoring one application database at a time sidesteps all three, and as a
# bonus means the source VM's root password is never needed here.

# Where fetched dump sets live on the CONTROLLER: <migration_dir>/<portal>/<ts>/.
migration_dir: "{{ data_dir }}/migration"

# The fetch side (source hosts, source credentials, which databases to move)
# lives in playbooks/vars/portal-migration.yml, because those plays target the
# source VMs and never apply this role. The restore side derives the database
# list from the dump filenames in the set, so the two cannot drift apart.
#
# All of the following must be set on the command line; there is no inventory
# default that can turn a restore on by accident.
db_restore: false
db_restore_confirm: ""
# Where dumps are staged on the target host before `docker exec -i ... < file`.
# Removed again once loaded.
db_restore_stage_dir: /tmp/la-db-restore
# Services restore-reconcile.yml leaves alone when it restarts everything over
# the restored data: the datastores themselves (restarting them would knock over
# what the rest is waiting on) and nginx (it is the single front door and only
# ever wants a graceful reload).
db_restore_restart_exclude:
  - mysql
  - mongodb
  - postgres
  - cassandra
  - solr
  - zookeeper
  - elasticsearch
  - nginx
# Restore over databases that already hold rows. Off by default: a migration
# into a freshly deployed stack is safe and needs no flag, while overwriting
# live data is a separate, deliberate decision.
db_restore_force: false
# Directory of a fetched dump set on the controller (must contain manifest.json).
migration_src_dir: ""

# Free-space thresholds for validate-pre-deploy.yml. The fail threshold only
# applies when la_env=production.
#
# Both numbers come from measuring gbif-es-docker-prod-2026 after the 2026-08-04
# ENOSPC outage, not from a round-number guess:
#
#   fail (5 GB) — what a deploy needs to finish rather than die half way. The
#   namematching Lucene index dominates: ~3x its tarball on both the staging and
#   the destination filesystem (see ala-install's download-nameindex.yml), which
#   is ~4.5 GB on these hosts. Below this, starting a deploy is worse than not
#   deploying: 2026-08-04 left /data/lucene/namematching-nm empty on two hosts
#   and namematching crash-looping.
#
#   warn (15 GB) — deliberately set where it will fire on every gbif-es prod
#   deploy, because it should. Those hosts have a single 29 GB volume carrying
#   /var/lib/docker, /var/lib/containerd and /data, and `docker system df`
#   reports the image working set alone at 11.6-14.2 GB with 0% reclaimable.
#   That leaves ~8 GB of real headroom on a good day. The warning is not noise to
#   be tuned away — it is the signal that the hosts need a bigger disk, or
#   /var/lib/docker moved to its own volume.
disk_warn_gb: 15
disk_fail_gb: 5

# Internal disk-usage metric for Gatus. The host's disk-metrics.timer
# (docker-housekeeping role) writes {{ nginx_conf_dir }}/metrics/disk.json and
# nginx serves it on docker_metrics_port, bound to docker_metrics_bind — the
# host's own private address, never 0.0.0.0. The server block behind that port
# serves /disk.json and 404s everything else.
#
# It is a published port rather than a bare `expose` because gatus runs on a
# single host of the cluster: an exposed port would only be reachable inside that
# host's compose network, leaving the rest unmonitored. On 2026-08-04 two of the
# three gbif-es prod hosts hit 100% and one of them was not the gatus host.
docker_metrics_enabled: true
docker_metrics_port: 8081
# Bind to the host's private IP like every other published infra port (solr/mysql/…). Docker
# rejects a hostname in a port binding ('invalid IP address'); ansible_host is a hostname in the
# generated inventories, so reuse host_private_ip (the generator sets it per host; 0.0.0.0 default).
docker_metrics_bind: "{{ host_private_ip }}"
# Gatus alerts above this; the point is to hear about it at 80%, not at ENOSPC.
gatus_disk_used_pct_threshold: 80
gatus_disk_interval: 5m
