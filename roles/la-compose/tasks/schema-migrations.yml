---
# Idempotent schema migrations for EXISTING databases.
#
# The init-databases tasks are create-if-missing (`CREATE ... IF NOT EXISTS`),
# so a fix that changes how an object is CREATED never reaches a database that
# already exists — historically those fixes "required a clean deploy", which is
# not an option in production. This file is the redeploy-safe alternative:
#
#   Pattern per migration: SELECT the current state -> apply ALTER only when it
#   differs -> report honestly (changed only when something was altered).
#   Never DROP/DELETE. Safe to re-run forever.
#
# Add new migrations at the end, with a comment naming the original commit/bug.

# --- Migration 1: emmet (CAS user store) collation -------------------------
# 6646fb6 fixed MySQL error 1267 (stored procedures created with the server
# default utf8mb4_0900_ai_ci vs tables in utf8mb4_unicode_ci) by adding COLLATE
# to CREATE DATABASE — which only helps fresh volumes. Bring aged databases to
# the same state: fix the database default AND convert any table left behind
# on the old collation (emmet is small; the conversion is quick).

- name: "DB Migration: emmet — check current database default collation"
  ansible.builtin.command: >
    docker exec la_mysql mysql -N -u root -p{{ mysql_root_password }}
    -e "SELECT DEFAULT_COLLATION_NAME FROM information_schema.SCHEMATA
        WHERE SCHEMA_NAME='{{ cas_db_name | default('emmet') }}';"
  register: emmet_db_collation
  become: true
  changed_when: false
  no_log: true
  when: "'mysql' in db_compose_services.stdout_lines"
  tags: [db-init, db-migrations]

- name: "DB Migration: emmet — set database default collation to utf8mb4_unicode_ci"
  ansible.builtin.command: >
    docker exec la_mysql mysql -u root -p{{ mysql_root_password }}
    -e "ALTER DATABASE {{ cas_db_name | default('emmet') }}
        CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
  become: true
  no_log: true
  when:
    - "'mysql' in db_compose_services.stdout_lines"
    - (emmet_db_collation.stdout | default('') | trim) not in ('', 'utf8mb4_unicode_ci')
  tags: [db-init, db-migrations]

- name: "DB Migration: emmet — list tables on a different collation"
  ansible.builtin.command: >
    docker exec la_mysql mysql -N -u root -p{{ mysql_root_password }}
    -e "SELECT TABLE_NAME FROM information_schema.TABLES
        WHERE TABLE_SCHEMA='{{ cas_db_name | default('emmet') }}'
          AND TABLE_TYPE='BASE TABLE'
          AND TABLE_COLLATION IS NOT NULL
          AND TABLE_COLLATION <> 'utf8mb4_unicode_ci';"
  register: emmet_bad_tables
  become: true
  changed_when: false
  no_log: true
  when: "'mysql' in db_compose_services.stdout_lines"
  tags: [db-init, db-migrations]

- name: "DB Migration: emmet — convert stray tables to utf8mb4_unicode_ci"
  ansible.builtin.command: >
    docker exec la_mysql mysql -u root -p{{ mysql_root_password }}
    -e "ALTER TABLE {{ cas_db_name | default('emmet') }}.{{ item }}
        CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
  loop: "{{ emmet_bad_tables.stdout_lines | default([]) }}"
  become: true
  no_log: true
  when: "'mysql' in db_compose_services.stdout_lines"
  tags: [db-init, db-migrations]

- name: "DB Migration: emmet collation — report"
  ansible.builtin.debug:
    msg: >-
      emmet collation: db default was
      '{{ emmet_db_collation.stdout | default('n/a') | trim }}'
      ({{ 'fixed' if (emmet_db_collation.stdout | default('') | trim) not in ('', 'utf8mb4_unicode_ci') else 'ok' }});
      tables converted: {{ emmet_bad_tables.stdout_lines | default([]) | length }}
  when: "'mysql' in db_compose_services.stdout_lines"
  tags: [db-init, db-migrations]

# --- Migration 2: logger remote_address from logger_authorize_ip_list -------
# logger-service answers 401 to event POSTs from an IP missing from remote_address,
# and biocache-service only logs a WARN, so a biocache-service moved to a new host
# loses its download statistics while every health check stays green. The
# ala-install task that fills the table is skipped on compose deploys, which left
# it with whatever an imported dump brought. Only adds rows: an IP added by hand
# stays, and so does one the inventory no longer lists.

- name: "DB Migration: logger — check remote_address exists"
  ansible.builtin.command: >
    docker exec la_mysql mysql -N -u root -p{{ mysql_root_password }}
    -e "SELECT COUNT(*) FROM information_schema.TABLES
        WHERE TABLE_SCHEMA='{{ logger_db_name | default('logger') }}'
          AND TABLE_NAME='remote_address';"
  register: logger_remote_address_table
  become: true
  changed_when: false
  no_log: true
  when:
    - "'mysql' in db_compose_services.stdout_lines"
    - "'logger-service' in physical_server_groups | default([])"
  tags: [db-init, db-migrations]

- name: "DB Migration: logger — list the authorised IPs"
  ansible.builtin.command: >
    docker exec la_mysql mysql -N -u root -p{{ mysql_root_password }}
    -e "SELECT ip FROM {{ logger_db_name | default('logger') }}.remote_address;"
  register: logger_known_ips
  become: true
  changed_when: false
  no_log: true
  when: (logger_remote_address_table.stdout | default('0') | trim) == '1'
  tags: [db-init, db-migrations]

- name: "DB Migration: logger — authorise the IPs missing from remote_address"
  ansible.builtin.command: >
    docker exec la_mysql mysql -u root -p{{ mysql_root_password }}
    -e "INSERT INTO {{ logger_db_name | default('logger') }}.remote_address (ip, host_name)
        VALUES ('{{ item }}', '{{ item }}');"
  loop: >-
    {{ (logger_authorize_ip_list | default('') | regex_replace(' ', '')).split(',')
       | reject('equalto', '') | difference(logger_known_ips.stdout_lines) }}
  become: true
  no_log: true
  when: logger_known_ips.stdout_lines is defined
  tags: [db-init, db-migrations]

# --- Migration 3: emmet authorised_system from userdetails_authorize_ip_list -
# userdetails answers 401 to its web-service calls from a host missing from
# emmet.authorised_system, and the callers log nothing a health check would show:
# ala-hub's user profile and its saved-fields download simply come back empty.
# The ala-install task that fills the table runs auth-ip.sql from the userdetails
# role's `vm-tasks.yml`, so it is skipped on compose deploys and the table keeps
# whatever an imported dump brought. Every host added to the stack afterwards
# then needs a manual INSERT, which is how the gap stays open.
# Same shape and same promise as migration 2: only adds rows, so an IP added by
# hand stays, and so does one the inventory no longer lists.

- name: "DB Migration: emmet — check authorised_system exists"
  ansible.builtin.command: >
    docker exec la_mysql mysql -N -u root -p{{ mysql_root_password }}
    -e "SELECT COUNT(*) FROM information_schema.TABLES
        WHERE TABLE_SCHEMA='{{ cas_db_name | default('emmet') }}'
          AND TABLE_NAME='authorised_system';"
  register: emmet_authorised_system_table
  become: true
  changed_when: false
  no_log: true
  when:
    - "'mysql' in db_compose_services.stdout_lines"
    - "'cas-servers' in physical_server_groups | default([])"
  tags: [db-init, db-migrations]

- name: "DB Migration: emmet — list the authorised hosts"
  ansible.builtin.command: >
    docker exec la_mysql mysql -N -u root -p{{ mysql_root_password }}
    -e "SELECT host FROM {{ cas_db_name | default('emmet') }}.authorised_system;"
  register: emmet_authorised_hosts
  become: true
  changed_when: false
  no_log: true
  when: (emmet_authorised_system_table.stdout | default('0') | trim) == '1'
  tags: [db-init, db-migrations]

# `version` is the GORM optimistic-locking column and is NOT NULL; auth-ip.sql
# seeds it with 1 and an empty description, and this stays byte-compatible with
# the rows that script writes, so the two can never disagree about a host.
- name: "DB Migration: emmet — authorise the hosts missing from authorised_system"
  ansible.builtin.command: >
    docker exec la_mysql mysql -u root -p{{ mysql_root_password }}
    -e "INSERT INTO {{ cas_db_name | default('emmet') }}.authorised_system (host, description, version)
        VALUES ('{{ item }}', '', 1);"
  loop: >-
    {{ (userdetails_authorize_ip_list | default('') | regex_replace(' ', '')).split(',')
       | reject('equalto', '') | difference(emmet_authorised_hosts.stdout_lines) }}
  become: true
  no_log: true
  when: emmet_authorised_hosts.stdout_lines is defined
  tags: [db-init, db-migrations]
