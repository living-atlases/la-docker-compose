---
# Second half of pipelines-shapefiles-start.yml: wait for the background download, then
# unpack. A background download that failed or never started (e.g. a --tags run that
# skipped the start) is not fatal here: the synchronous get_url below is the fallback,
# and returns at once when the background one left a zip with the right checksum.
- name: Pipelines shapefiles | wait for the background download
  ansible.builtin.async_status:
    jid: "{{ pipelines_shp_async.ansible_job_id }}"
  register: pipelines_shp_job
  until: pipelines_shp_job.finished
  retries: "{{ ((pipelines_shapefiles_async_timeout | default(5400) | int) / 10) | int }}"
  delay: 10
  failed_when: false
  become: true
  when: pipelines_shp_async.ansible_job_id is defined

- name: Pipelines shapefiles | report a failed background download
  ansible.builtin.debug:
    msg: "WARNING: background shapefiles download failed ({{ pipelines_shp_job.msg | default('no message') }}); retrying in the foreground"
  when:
    - pipelines_shp_job is defined
    - pipelines_shp_job.failed | default(false) or pipelines_shp_job.rc | default(0) != 0

- name: Pipelines shapefiles | ensure the directory exists (also without the start)
  ansible.builtin.file:
    path: "{{ data_dir }}/pipelines-shp"
    state: directory
    owner: "{{ docker_container_uid }}"
    group: "{{ docker_container_gid }}"
    mode: '0755'
  become: true

- name: Download the pipelines geocode shapefiles
  ansible.builtin.get_url:
    url: "{{ pipelines_shapefiles_url | default('https://pipelines-shp.s3-ap-southeast-2.amazonaws.com/pipelines-shapefiles.zip') }}"
    dest: "{{ data_dir }}/pipelines-shp/pipelines-shapefiles.zip"
    checksum: "{{ pipelines_shapefiles_checksum | default('sha1:d4755425902e109e749c319f8d4ee98fa7ef2c4d') }}"
    owner: "{{ docker_container_uid }}"
    group: "{{ docker_container_gid }}"
    mode: '0644'
  become: true
  register: pipelines_shp_download
  retries: 2
  delay: 10
  until: pipelines_shp_download is succeeded
  when: not (pipelines_shp_marker.stat.exists | default(false))

- name: Unpack the pipelines geocode shapefiles
  ansible.builtin.unarchive:
    src: "{{ data_dir }}/pipelines-shp/pipelines-shapefiles.zip"
    dest: "{{ data_dir }}/pipelines-shp"
    remote_src: true
    owner: "{{ docker_container_uid }}"
    group: "{{ docker_container_gid }}"
    creates: "{{ data_dir }}/pipelines-shp/cw_state_poly.dbf"
  become: true
