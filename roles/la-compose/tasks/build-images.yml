---
# Build and pull Docker images
# This task file is included when build_images is true

- name: Display build information
  ansible.builtin.debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "Preparing images"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "  Configuration:"
      - "    - Registry: {{ docker_registry | default('(local)') }}"
      - "    - Services: {{ services_enabled | join(', ') }}"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

- name: Check docker buildx availability
  ansible.builtin.command: docker buildx version
  register: buildx_check
  failed_when: false
  changed_when: false
  when:
    - not (la_compose_render_only | default(false) | bool)
    - "'branding' in services_enabled"

- name: Fail if docker buildx not available
  ansible.builtin.fail:
    msg: |
      docker buildx is required to build branding images but is not available.
      docker buildx was added in Docker 19.03 and is installed by default on most systems.
      
      To enable buildx on your system:
      - Update Docker to 19.03 or later
      - On Linux, you may need to install docker-buildx plugin: https://github.com/docker/buildx
  when:
    - not (la_compose_render_only | default(false) | bool)
    - "'branding' in services_enabled"
    - buildx_check.rc != 0

- name: Generate docker-bake.hcl for branding
  ansible.builtin.template:
    src: docker-bake.hcl.j2
    dest: "{{ docker_compose_data_dir }}/docker-bake.hcl"
    mode: '0644'
  when:
    - "'branding' in services_enabled or (branding_render_list | default([]) | length > 0)"

# One target per staged branding: the portal's plus one per data hub that declares a
# branding_source. Falls back to the single 'branding' target when nothing recorded a
# list, which is what a deployment with no hubs and an older render produces.
- name: Resolve the branding bake targets
  ansible.builtin.include_tasks: branding-bake-targets.yml
  when:
    - "'branding' in services_enabled or (branding_render_list | default([]) | length > 0)"

# BuildKit's cache DB lives in docker's data-root (/var/lib/docker/buildkit), but with the
# containerd snapshotter the layers it points at live in /var/lib/containerd. Anything that empties
# the image store without clearing that DB — moving /var/lib/containerd to its own volume, as the
# gbif-es prod-2026 hosts did on 2026-08-13 — leaves records referencing snapshots that are gone,
# and every build then dies on "parent snapshot <sha> does not exist: not found". The cache is
# disposable, so drop it and build again rather than failing the host out of the play.
- block:
    - name: Build site-specific branding using docker buildx bake
      ansible.builtin.command: docker buildx bake -f docker-bake.hcl {{ branding_bake_targets | join(" ") }}
      args:
        chdir: "{{ docker_compose_data_dir }}"
      register: build_branding
      changed_when: true
  rescue:
    - name: Discard the build cache after a failed branding build
      ansible.builtin.command: docker buildx prune -af
      changed_when: true

    - name: Rebuild site-specific branding with an empty build cache
      ansible.builtin.command: docker buildx bake -f docker-bake.hcl {{ branding_bake_targets | join(" ") }}
      args:
        chdir: "{{ docker_compose_data_dir }}"
      register: build_branding
      changed_when: true
  # Bundle render: docker-bake.hcl and the targets above are rendered; the build is the apply
  # side's (scripts/bundle/host-apply.sh runs the same bake, with the same prune-and-retry).
  when:
    - not (la_compose_render_only | default(false) | bool)
    - "'branding' in services_enabled or (branding_render_list | default([]) | length > 0)"

# A pinned tag (x:1.2.3, x@sha256:...) names the same image forever, so it is pulled only when
# it is missing: `docker compose pull` re-resolved ~40 manifests per host on every run, 4.4 min
# of each #430/#431 playbook with everything already cached. Mutable tags (:latest, or no tag)
# are still pulled every time, so a redeploy picks up their new builds.
# la_compose_pull_policy=always restores the old behaviour for pinned tags too.
- name: List the services whose image tag is mutable
  ansible.builtin.command: docker compose config --format json
  args:
    chdir: "{{ docker_compose_data_dir }}"
  become: true
  register: compose_config_for_pull
  changed_when: false
  when:
    - not (la_compose_render_only | default(false) | bool)
    - docker_registry | default('') != ''
  tags:
    - build
    - docker-compose

- name: Split the services by image tag
  ansible.builtin.set_fact:
    compose_mutable_tag_services: >-
      {{ (compose_config_for_pull.stdout | from_json).services | dict2items
         | selectattr('value.image', 'defined')
         | selectattr('value.image', 'search', '(:latest$)|(^[^:@]*$)|(/[^/:@]*$)')
         | map(attribute='key') | list }}
  when:
    - not (la_compose_render_only | default(false) | bool)
    - docker_registry | default('') != ''
  tags:
    - build
    - docker-compose

# Docker Hub fails transiently on its own token endpoint and `docker compose pull` aborts every
# in-flight layer with it (2026-08-05, build #331: "auth.docker.io/token: 500 Internal Server
# Error" while pulling db-backup). Unretried, that single 500 fails the task, drops the host out
# of the play and leaves it with NO containers at all — which is what emptied
# gbif-es-docker-cluster-2023-1 and turned every one of its vhosts red in Gatus.
- name: Pull Docker images
  ansible.builtin.command: docker compose pull --policy {{ la_compose_pull_policy | default('missing') }}
  args:
    chdir: "{{ docker_compose_data_dir }}"
  become: true
  register: compose_pull
  until: compose_pull.rc == 0
  retries: 3
  delay: 30
  changed_when: true
  when:
    - not (la_compose_render_only | default(false) | bool)
    - docker_registry | default('') != ''
  tags:
    - build
    - docker-compose

- name: Pull the images with a mutable tag
  ansible.builtin.command:
    argv: "{{ ['docker', 'compose', 'pull', '--policy', 'always'] + compose_mutable_tag_services }}"
  args:
    chdir: "{{ docker_compose_data_dir }}"
  become: true
  register: compose_pull_mutable
  until: compose_pull_mutable.rc == 0
  retries: 3
  delay: 30
  changed_when: true
  when:
    - not (la_compose_render_only | default(false) | bool)
    - docker_registry | default('') != ''
    - la_compose_pull_policy | default('missing') != 'always'
    - compose_mutable_tag_services | default([]) | length > 0
  tags:
    - build
    - docker-compose
