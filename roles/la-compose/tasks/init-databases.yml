         CREATE ROLE {{ geonetwork_db_username | default('geonetwork') }} LOGIN CREATEDB PASSWORD '{{ geonetwork_db_password }}';
       END IF;
     END $$;
     ALTER ROLE {{ geonetwork_db_username | default('geonetwork') }} WITH LOGIN CREATEDB PASSWORD '{{ geonetwork_db_password }}';"
  become: true
  when: "'geonetwork' in physical_server_groups"
