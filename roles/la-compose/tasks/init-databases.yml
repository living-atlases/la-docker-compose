# --- layersdb (spatial-service) PostGIS database + login role + schema ---
# The ala-install layers-db role assumes a local postgres (createdb/psql as the postgres
# system user); in container mode provision via docker exec against la_postgres. Needs PostGIS.
- name: "DB Init: Create/sync layers postgres login role (idempotent)"
  ansible.builtin.command: >
    docker exec -u postgres la_postgres psql -v ON_ERROR_STOP=1 -c
    "DO $$ BEGIN
       IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='{{ layers_db_username | default('layers') }}') THEN
         CREATE ROLE {{ layers_db_username | default('layers') }} LOGIN PASSWORD '{{ layers_db_password }}';
       END IF;
     END $$;
     ALTER ROLE {{ layers_db_username | default('layers') }} WITH LOGIN PASSWORD '{{ layers_db_password }}';"
  become: true
  when: "'spatial-service' in physical_server_groups"
  changed_when: false
  no_log: true
  tags: [db-init, db-password-sync]

- name: "DB Init: Check if layersdb postgres database exists"
  ansible.builtin.command: >
    docker exec -u postgres la_postgres psql -tAc
    "SELECT 1 FROM pg_database WHERE datname='{{ layers_db_name | default('layersdb') }}'"
  register: layersdb_exists
  become: true
  changed_when: false
  when: "'spatial-service' in physical_server_groups"
  tags: [db-init]

- name: "DB Init: Create layersdb database owned by layers + enable PostGIS"
  ansible.builtin.command: >
    docker exec -u postgres la_postgres psql -v ON_ERROR_STOP=1 -c
    "CREATE DATABASE {{ layers_db_name | default('layersdb') }} OWNER {{ layers_db_username | default('layers') }}"
  become: true
  when:
    - "'spatial-service' in physical_server_groups"
    - (layersdb_exists.stdout | default('') | trim) != "1"
  tags: [db-init]

- name: "DB Init: Enable PostGIS + uuid-ossp extensions on layersdb"
  # Match ala-install pg_instance (extensions: postgis, postgis_topology, uuid-ossp). uuid-ossp
  # needs double-quoting (the hyphen is not a bare identifier); single-quote the whole -c arg so
  # the inner "uuid-ossp" needs no shell escaping. All ship with the postgis/postgis:16 image.
  ansible.builtin.command: >
    docker exec -u postgres la_postgres psql -v ON_ERROR_STOP=1
    -d {{ layers_db_name | default('layersdb') }} -c
    'CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS postgis_topology; CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
  become: true
  when: "'spatial-service' in physical_server_groups"
  changed_when: false
  tags: [db-init]

- name: "DB Init: Download layersdb schema (first run only)"
  ansible.builtin.get_url:
    url: "{{ layersdb_schema_url | default('https://github.com/AtlasOfLivingAustralia/spatial-database/raw/master/layersdb.sql') }}"
    dest: "{{ docker_compose_data_dir }}/layersdb.sql"
    mode: '0644'
  become: true
  when:
    - "'spatial-service' in physical_server_groups"
    - (layersdb_exists.stdout | default('') | trim) != "1"
  tags: [db-init]

- name: "DB Init: Load layersdb schema (first run only)"
  # Upstream layersdb.sql is a `pg_dump --create` (drop database / create database /
  # \connect / CREATE EXTENSION postgis). We already created layersdb (OWNER layers) and
  # enabled PostGIS above, so those cluster-level lines error harmlessly ("cannot drop the
  # currently open database", "... already exists"). Match the VM `layers-db` role, which
  # loads with `psql layersdb -f` and NO error-stop: psql prints those errors but continues
  # and loads the schema (verified: 17 tables + 780 functions on postgis/postgis:16-3.4-alpine).
  # NB: adding `-v ON_ERROR_STOP=1` is what made the tolerated drop-database error fatal (CI #224).
  ansible.builtin.shell: >
    docker exec -i la_postgres psql -U postgres
    -d {{ layers_db_name | default('layersdb') }} < {{ docker_compose_data_dir }}/layersdb.sql
  become: true
  when:
    - "'spatial-service' in physical_server_groups"
    - (layersdb_exists.stdout | default('') | trim) != "1"
  tags: [db-init]

- name: "DB Init: Make the layers role own all layersdb objects"
  # layersdb.sql is loaded as the postgres superuser, so most tables end up owned by
  # postgres (only a handful by layers). spatial-service connects as layers and fails
  # with "permission denied for table ..." (fields, task, objects, ...) and, at boot,
  # "must be owner of table ..." on its CREATE INDEX / ALTER TABLE schema-ensure. Reassign
  # ownership of every public app table/sequence to layers (skip the PostGIS-owned
  # spatial_ref_sys). Runs unconditionally (idempotent) so it also repairs an existing DB.
  ansible.builtin.command: >
    docker exec -u postgres la_postgres psql -v ON_ERROR_STOP=1
    -d {{ layers_db_name | default('layersdb') }} -c
    "DO $$ DECLARE r record; BEGIN
       FOR r IN SELECT tablename FROM pg_tables
                WHERE schemaname='public' AND tablename <> 'spatial_ref_sys'
                  AND tableowner <> '{{ layers_db_username | default('layers') }}'
       LOOP EXECUTE format('ALTER TABLE public.%I OWNER TO {{ layers_db_username | default('layers') }}', r.tablename); END LOOP;
       FOR r IN SELECT sequencename FROM pg_sequences WHERE schemaname='public'
       LOOP EXECUTE format('ALTER SEQUENCE public.%I OWNER TO {{ layers_db_username | default('layers') }}', r.sequencename); END LOOP;
     END $$;"
  become: true
  when: "'spatial-service' in physical_server_groups"
  changed_when: false
  tags: [db-init]

# --- geonetwork PostGIS database + login role ---
# CREATEDB is required: the geonetwork:*-postgres image entrypoint connects as this role and
# createdb's a (vestigial) `admin` db on boot — without CREATEDB it exits (set -e) and crash-loops.
- name: "DB Init: Create/sync geonetwork postgres login role (idempotent)"
  ansible.builtin.command: >
    docker exec -u postgres la_postgres psql -v ON_ERROR_STOP=1 -c
