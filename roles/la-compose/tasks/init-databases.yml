  become: true
  when: "'geonetwork' in physical_server_groups"
  changed_when: false
  tags: [db-init]

# Idempotent check-then-ALTER migrations for databases that already exist —
# fixes that changed a CREATE statement (e.g. emmet collation, 6646fb6) reach
# aged/production volumes here instead of "requiring a clean deploy".
- name: "DB Init: Apply idempotent schema migrations to existing databases"
  ansible.builtin.include_tasks: schema-migrations.yml
  tags:
    - db-init
    - db-migrations

- name: "DB Init: Verify database initialization completed successfully"
  ansible.builtin.include_tasks: validate-db-init.yml
  when: "'cas-servers' in physical_server_groups"
  tags:
    - db-init
    - db-validation

- name: "DB Init: Database initialization completed successfully"
  ansible.builtin.debug:
    msg: "✅ Database initialization completed. Ready to start all services."
  tags:
    - db-init
