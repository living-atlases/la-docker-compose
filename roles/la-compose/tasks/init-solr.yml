---
# Solr Collection Initialization Tasks
# Called from main.yml after `docker compose up`, before post-deploy health check.
#
# Replaces the old one-shot `solr-init` compose service, which only ran once at
# create time: when it was created while ZooKeeper was still unhealthy its
# `depends_on` failed, and with `restart: "no"` it never re-ran after ZK was
# fixed -> the biocache/bie collections were never created in the external ZK and
# biocache-service died with "Collection not found: biocache".
#
# This task is idempotent and re-runs every deploy: it uploads the configsets
# (upconfig overwrites) and creates each collection only if LIST shows it missing.
# Pattern mirrors init-databases.yml and reuses ala-install solrcloud_config logic.

- name: "Solr Init: Detect running solr container"
  ansible.builtin.command: docker ps --filter name=la_solr --format '{{ "{{" }}.Names{{ "}}" }}'
  register: solr_container_check
  become: true
  changed_when: false
  tags:
    - solr-init

- name: "Solr Init: Skip if Solr is not part of this profile"
  ansible.builtin.debug:
    msg: "la_solr container not running — skipping Solr collection init."
  when: "'la_solr' not in solr_container_check.stdout_lines"
  tags:
    - solr-init

# Everything below only runs when la_solr is present.
- name: "Solr Init: Ensure collections (Solr present)"
  when: "'la_solr' in solr_container_check.stdout_lines"
  tags:
    - solr-init
  block:
    - name: "Solr Init: Wait for la_solr to be healthy"
      ansible.builtin.shell: |
        docker inspect --format='{{ "{{" }}.State.Health.Status{{ "}}" }}' la_solr
      register: solr_health
      until: 'solr_health.stdout == "healthy"'
      retries: 60
      delay: 5
      become: true
      changed_when: false

    # Stage the configsets INTO the la_solr container, then upconfig from there —
    # instead of reading them through the `:ro` bind mount at /var/solr/init. That
    # bind is nested inside the external `la_solr-data` volume
    # (la_solr-data:/var/solr  +  .../solr/init:/var/solr/init), and on the cluster's
    # Docker the nested bind intermittently does NOT become visible inside the
    # container: upconfig failed with "Path /var/solr/init/biocache/conf does not
    # exist" even though the host dir was correctly staged (multi-host build #198).
    #
    # `docker cp` was tried as a workaround but STILL failed on multi-host with
    # "Path /tmp/solr-init/biocache/conf does not exist" (build #200): docker cp
    # writes into the container's graph layer, which is masked when /tmp is a
    # tmpfs/volume mount, so the upconfig `docker exec` (a different view) sees an
    # empty dir. We now stream the configsets through `docker exec -i tar -x`, which
    # extracts inside the SAME mount namespace the upconfig exec uses — visibility is
    # guaranteed whatever /tmp is. The `test -d` guards fail loudly if staging did not
    # land, so we never silently proceed to a failing upconfig. Idempotent every run.
    - name: "Solr Init: Stage configsets into the la_solr container (tar via exec, mount-safe)"
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec la_solr rm -rf /tmp/solr-init
        docker exec la_solr mkdir -p /tmp/solr-init
        tar -C {{ docker_compose_data_dir }}/solr/init -cf - . \
          | docker exec -i la_solr tar -C /tmp/solr-init -xf -
        docker exec la_solr test -d /tmp/solr-init/biocache/conf
        docker exec la_solr test -d /tmp/solr-init/bie/conf
      args:
        executable: /bin/bash
      become: true
      changed_when: true

    - name: "Solr Init: Upload configsets to ZooKeeper (upconfig — idempotent overwrite)"
      ansible.builtin.command: >
        docker exec la_solr
        /opt/solr/server/scripts/cloud-scripts/zkcli.sh
        -cmd upconfig -zkhost zookeeper:2181
        -confname {{ item }}
        -solrhome /var/solr/data
        -confdir /tmp/solr-init/{{ item }}/conf
      become: true
      changed_when: false
      loop:
        - biocache
        - bie

    - name: "Solr Init: List existing collections"
      ansible.builtin.command: >
        docker exec la_solr curl -s
        "http://localhost:8983/solr/admin/collections?action=LIST&wt=json"
      register: solr_collections
      become: true
      changed_when: false

    # `biocache` has to be an ALIAS, not a collection, for the production reindex path to
    # work at all: Full_index_to_solr builds a dated collection and then swaps the alias
    # onto it, and SolrCloud refuses an alias whose name is already a collection.
    - name: "Solr Init: List existing aliases"
      ansible.builtin.command: >
        docker exec la_solr curl -s
        "http://localhost:8983/solr/admin/collections?action=LISTALIASES&wt=json"
      register: solr_aliases
      become: true
      changed_when: false

    # A `bie` that is a real collection is a deployment made before the alias model. Deleting
    # one that holds an index would be unacceptable as a side effect of a deploy -- but an
    # EMPTY one is not an index, it is the state every deployment has been in since forever,
    # because nothing in the chain ever imported a taxonomy. Migrating those costs nothing and
    # is the only way this change reaches a stack that already exists. A populated one is left
    # alone and gets the explanatory message further down instead.
    - name: "Solr Init: Count documents in legacy bie collections"
      ansible.builtin.command: >
        docker exec la_solr curl -s
        "http://localhost:8983/solr/{{ item }}/select?q=*:*&rows=0&wt=json"
      register: solr_bie_legacy_count
      become: true
      changed_when: false
      # failed_when false, not ignore_errors: one of the two may legitimately not exist.
      failed_when: false
      loop:
        - bie
        - bie-offline
      when: item in (solr_collections.stdout | from_json).get('collections', [])

    - name: "Solr Init: Decide whether the legacy bie collections are safe to migrate"
      ansible.builtin.set_fact:
        # Safe only when EVERY legacy collection that exists answered, and answered zero.
        # A probe that failed leaves this false, so an unreadable collection is never deleted.
        _bie_legacy_empty: >-
          {{ solr_bie_legacy_count.results
             | rejectattr('skipped', 'defined')
             | selectattr('stdout', 'search', '"numFound":0[^0-9]')
             | list | length
             ==
             solr_bie_legacy_count.results | rejectattr('skipped', 'defined') | list | length }}

    - name: "Solr Init: Drop the EMPTY legacy bie collections so the aliases can take the names"
      ansible.builtin.command: >
        docker exec la_solr curl -s -X POST
        "http://localhost:8983/solr/admin/collections?action=DELETE&name={{ item }}&wt=json"
      register: solr_bie_legacy_delete
      become: true
      loop:
        - bie
        - bie-offline
      when:
        - _bie_legacy_empty | bool
        - item in (solr_collections.stdout | from_json).get('collections', [])
      changed_when: '"success" in solr_bie_legacy_delete.stdout'
      failed_when:
        - solr_bie_legacy_delete.rc != 0 or '"failure"' in solr_bie_legacy_delete.stdout

    # Re-read: the facts below decide what to create, and the deletions above just changed
    # the answer. Without this the play would still think `bie` is a collection.
    - name: "Solr Init: Re-list collections after the legacy cleanup"
      ansible.builtin.command: >
        docker exec la_solr curl -s
        "http://localhost:8983/solr/admin/collections?action=LIST&wt=json"
      register: solr_collections
      become: true
      changed_when: false

    - name: "Solr Init: Decide how biocache and bie are currently published"
      ansible.builtin.set_fact:
        # A pre-existing REAL collection called `biocache` is a deployment made before
        # this change. Migrating it is not transparent -- Solr cannot rename a collection,
        # so it would mean reindexing into a new one and dropping the old, i.e. losing the
        # live index. That is the operator's call, never a side effect of a deploy.
        _biocache_legacy_collection: >-
          {{ 'biocache' in (solr_collections.stdout | from_json).get('collections', []) }}
        _biocache_alias_present: >-
          {{ 'biocache' in (solr_aliases.stdout | from_json).get('aliases', {}) }}
        # Same shape for bie. Deployments made before the alias model carry REAL `bie` and
        # `bie-offline` collections; they keep them, and the promote step degrades to the
        # broken-upstream behaviour it already had rather than dropping a live index.
        _bie_legacy_collection: >-
          {{ 'bie' in (solr_collections.stdout | from_json).get('collections', [])
             or 'bie-offline' in (solr_collections.stdout | from_json).get('collections', []) }}
        _bie_alias_present: >-
          {{ 'bie' in (solr_aliases.stdout | from_json).get('aliases', {}) }}
        _bie_offline_alias_present: >-
          {{ 'bie-offline' in (solr_aliases.stdout | from_json).get('aliases', {}) }}

    - name: "Solr Init: Create SolrCloud collections if missing"
      ansible.builtin.command: >
        docker exec la_solr curl -s -X POST
        "http://localhost:8983/solr/admin/collections?action=CREATE&name={{ item.name }}&collection.configName={{ item.config }}&numShards=1&replicationFactor=1"
      register: solr_create
      become: true
      loop:
        - { name: "{{ biocache_seed_collection }}",    config: biocache, legacy: "{{ _biocache_legacy_collection | bool }}" }
        - { name: "{{ bie_live_seed_collection }}",    config: bie,      legacy: "{{ _bie_legacy_collection | bool }}" }
        - { name: "{{ bie_offline_seed_collection }}", config: bie,      legacy: "{{ _bie_legacy_collection | bool }}" }
      # Skip a seed entirely on a deployment that still publishes that index as a real
      # collection: there the old collection stays the live index, untouched.
      when:
        - item.name not in (solr_collections.stdout | from_json).get('collections', [])
        - not (item.legacy | bool)
      changed_when: '"success" in solr_create.stdout'
      failed_when:
        - solr_create.rc != 0 or '"failure"' in solr_create.stdout

    - name: "Solr Init: Point the biocache alias at the seed collection"
      ansible.builtin.command: >
        docker exec la_solr curl -s -X POST
        "http://localhost:8983/solr/admin/collections?action=CREATEALIAS&name=biocache&collections={{ biocache_seed_collection }}&wt=json"
      register: solr_alias_create
      become: true
      when:
        - not (_biocache_legacy_collection | bool)
        - not (_biocache_alias_present | bool)
      changed_when: '"success" in solr_alias_create.stdout or solr_alias_create.rc == 0'
      failed_when:
        - solr_alias_create.rc != 0 or '"failure"' in solr_alias_create.stdout

    # bie / bie-offline: one CREATEALIAS per side. bie-index writes the import into the
    # OFFLINE alias and serves searches from the LIVE one, and promoting means crossing the
    # two. Its own promote step (import.sequence's `swap`) is a SolrCloud SWAP on literal
    # core names and cannot work here, so `swap` is dropped from the sequence
    # (see generate-compose.yml) and scripts/e2e-bie-import.sh crosses the aliases instead.
    - name: "Solr Init: Point the bie aliases at their seed collections"
      ansible.builtin.command: >
        docker exec la_solr curl -s -X POST
        "http://localhost:8983/solr/admin/collections?action=CREATEALIAS&name={{ item.alias }}&collections={{ item.target }}&wt=json"
      register: solr_bie_alias_create
      become: true
      loop:
        - { alias: "bie",         target: "{{ bie_live_seed_collection }}",    present: "{{ _bie_alias_present | bool }}" }
        - { alias: "bie-offline", target: "{{ bie_offline_seed_collection }}", present: "{{ _bie_offline_alias_present | bool }}" }
      # Never re-point an alias that already exists: after the first import the live alias
      # points at whichever collection won the last promote, and a deploy must not undo it.
      when:
        - not (_bie_legacy_collection | bool)
        - not (item.present | bool)
      changed_when: '"success" in solr_bie_alias_create.stdout or solr_bie_alias_create.rc == 0'
      failed_when:
        - solr_bie_alias_create.rc != 0 or '"failure"' in solr_bie_alias_create.stdout

    # Legacy path only: keep the pre-alias behaviour intact. A deployment whose populated
    # `bie` blocks the alias migration must still get a `bie-offline` if it somehow lacks one,
    # or the resolve probe at the end of this file fails a deploy that used to work.
    - name: "Solr Init: Create the literal bie collections a legacy deployment still needs"
      ansible.builtin.command: >
        docker exec la_solr curl -s -X POST
        "http://localhost:8983/solr/admin/collections?action=CREATE&name={{ item }}&collection.configName=bie&numShards=1&replicationFactor=1"
      register: solr_bie_legacy_create
      become: true
      loop:
        - bie
        - bie-offline
      when:
        - _bie_legacy_collection | bool
        - item not in (solr_collections.stdout | from_json).get('collections', [])
      changed_when: '"success" in solr_bie_legacy_create.stdout'
      failed_when:
        - solr_bie_legacy_create.rc != 0 or '"failure"' in solr_bie_legacy_create.stdout

    - name: "Solr Init: bie is still a collection -- alias migration skipped"
      ansible.builtin.debug:
        msg: >-
          `bie` and/or `bie-offline` exist as real SolrCloud collections on this deployment,
          so the aliases were NOT created: Solr forbids an alias named after an existing
          collection. Searches keep working, but promoting a fresh taxonomy import to live
          does not: bie-index does that with a SolrCloud SWAP on the literal core names
          (IndexService.swap()), which under SolrCloud addresses cores that are really named
          <collection>_shard1_replica_nN. To migrate -- it costs the current bie index, so it
          is deliberately left to you:
            1. curl "http://<solr>:8983/solr/admin/collections?action=DELETE&name=bie"
            2. curl ".../admin/collections?action=DELETE&name=bie-offline"
            3. re-run this play; it creates {{ bie_live_seed_collection }} /
               {{ bie_offline_seed_collection }} plus the two aliases
            4. re-import the taxonomy (scripts/e2e-bie-import.sh, or bie-index /admin/import)
          Upstream finding 3.6a/3.6c: living-atlases/la-toolkit#28.
      when: _bie_legacy_collection | bool

    - name: "Solr Init: biocache is still a collection -- alias migration skipped"
      ansible.builtin.debug:
        msg: >-
          `biocache` exists as a real SolrCloud collection on this deployment, so the
          alias was NOT created: Solr forbids an alias named after an existing collection,
          and it cannot rename one. Everything keeps working exactly as before, but the
          Airflow reindex path (Full_index_to_solr -> Update-Collection-Alias) cannot swap
          the alias until this is migrated by hand. The migration costs the current index,
          so it is deliberately left to you:
            1. reindex into a dated collection, e.g.
               la-pipelines solr all --extra-args="solrCollection=biocache-$(date +%F)"
            2. curl "http://<solr>:8983/solr/admin/collections?action=DELETE&name=biocache"
            3. curl "http://<solr>:8983/solr/admin/collections?action=CREATEALIAS\
               &name=biocache&collections=biocache-<stamp>"
          Queries, updates and /admin/luke all resolve through an alias, so biocache-service,
          gatus and the Cypress suites need no change.
      when: _biocache_legacy_collection | bool

    # Prove biocache actually answers, whether it resolves as an alias or as a legacy
    # collection. LIST alone would not: an alias does not appear in it.
    - name: "Solr Init: Verify biocache resolves and answers a query"
      ansible.builtin.command: >
        docker exec la_solr curl -s
        "http://localhost:8983/solr/biocache/select?q=*:*&rows=0&wt=json"
      register: solr_biocache_probe
      become: true
      changed_when: false
      failed_when: >-
        solr_biocache_probe.rc != 0
        or '"numFound"' not in solr_biocache_probe.stdout

    # Same reason as above: LIST does not show aliases, so only a real query proves that
    # `bie` and `bie-offline` resolve. This says nothing about whether they hold documents
    # -- an empty bie index is a legitimate deployment, and the honest count lives in the
    # gatus "Data checks" group, not here.
    - name: "Solr Init: Verify the bie indexes resolve and answer a query"
      ansible.builtin.command: >
        docker exec la_solr curl -s
        "http://localhost:8983/solr/{{ item }}/select?q=*:*&rows=0&wt=json"
      register: solr_bie_probe
      become: true
      changed_when: false
      loop:
        - bie
        - bie-offline
      failed_when: >-
        solr_bie_probe.rc != 0
        or '"numFound"' not in solr_bie_probe.stdout
