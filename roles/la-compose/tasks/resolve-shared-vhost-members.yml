---
# Cross-host shared-vhost members (hub.l-a.site-style: ONE hostname split by
# PATH across DIFFERENT physical hosts, unlike spatial.*/auth.* which share a
# hostname on ONE host — see nginx_shared_vhost_service_keys in generate-compose.yml). For every
# hostname in nginx_shared_vhost_topology (setup-hub-facts.yml) claimed by
# members on more than one physical host:
#   - nginx_shared_ports_needed: "<service_key>:<pkg>" for every LOCAL member
#     of such a hostname, so its own service template (biocache-hub.yml.j2
#     etc.) knows to publish its container port for siblings to reach.
#   - nginx_remote_shared_members: the members THIS host does NOT own, with
#     their owner resolved to a private IP via docker_extra_hosts_dict (must
#     run after it is built, above) and a fixed cross-host port per service
#     type. register-shared-vhost-stubs.yml turns these into proxy stubs.
# branding is static files (an nginx alias on the owner host), not a backend
# container, so it publishes no port and stays out of nginx_shared_ports_needed.
# It is NOT out of nginx_remote_shared_members any more: a sibling proxies the
# branding path to the OWNER'S NGINX over https (443, Host header = the shared
# hostname), which serves the alias. Leaving it out meant every non-owner copy of
# the vhost had no '/' at all, so hub.l-a.site/ answered 404 whenever the public
# name landed on a host other than the branding owner (Gatus hub.l-a.site/root,
# 2026-09-27). Ownership is
# decided by comparing each member's owner_alias's underlying physical
# hostname (ansible_host) to THIS host's own ansible_host, the same idiom
# hub_instances above already uses to resolve "is part of this hub HERE".
- name: Resolve cross-host shared-vhost membership (local ports to publish, remote members to proxy)
  ansible.builtin.set_fact:
    nginx_shared_ports_needed: >-
      {%- set needed = [] -%}
      {%- for hostname, members in (nginx_shared_vhost_topology | default({})).items() -%}
        {%- set owner_hosts = members | map(attribute='owner_alias')
              | map('extract', hostvars, 'ansible_host') | select('defined') | unique | list -%}
        {%- if owner_hosts | length > 1 -%}
          {%- for m in members -%}
            {%- if (hostvars[m.owner_alias].ansible_host | default(m.owner_alias)) == ansible_host
                   and m.service_key != 'branding' -%}
              {%- set _ = needed.append(m.service_key ~ ':' ~ m.pkg) -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {{ needed | unique | list }}
    nginx_remote_shared_members: >-
      {%- set remote = [] -%}
      {%- set port_by_service = {'biocache-hub': 18180, 'bie-hub': 18280, 'regions': 18380, 'branding': 443} -%}
      {%- set proto_by_service = {'branding': 'https'} -%}
      {%- for hostname, members in (nginx_shared_vhost_topology | default({})).items() -%}
        {%- set owner_hosts = members | map(attribute='owner_alias')
              | map('extract', hostvars, 'ansible_host') | select('defined') | unique | list -%}
        {%- if owner_hosts | length > 1 -%}
          {%- for m in members -%}
            {%- if (hostvars[m.owner_alias].ansible_host | default(m.owner_alias)) != ansible_host -%}
              {%- set owner_host = hostvars[m.owner_alias].ansible_host | default(m.owner_alias) -%}
              {%- set _ = remote.append({'hostname': hostname, 'service_key': m.service_key, 'pkg': m.pkg,
                                          'path': m.path, 'owner_private_ip': docker_extra_hosts_dict.get(owner_host, ''),
                                          'container_port': port_by_service.get(m.service_key, 8080),
                                          'proxy_proto': proto_by_service.get(m.service_key, 'http')}) -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {{ remote }}
  tags:
    - always
    - docker-compose
