---
# Which branding build one service's config should point at.
#
# WHY THIS EXISTS
#
# ala-bootstrap5 apps ask their branding for {assets,banner,footer}.mustache; the
# Bootstrap 3 build only has the .html ones. Pointed at a Bootstrap 3 branding, a
# Bootstrap 5 app renders with no CSS at all and its console fills with
# "$ is not defined": the mustache that would have loaded jQuery and Bootstrap 5
# answered 404. Nothing fails, so gatus stays green and the build passes -- which is
# how alerts 5.3.1 and logger 4.7.0 both ran unstyled on the CI portal unnoticed.
#
# TWO INPUTS, BOTH DATA
#
# 1. Which services need it, and from which version: `bootstrap5_from` in
#    vars/docker-services-desc.yaml, next to that service's `version_variable`. The
#    values mirror the toolkit's nextgen-compat.yaml (`from: '> X'`, so the comparison
#    here is strictly greater), which is where that fact is maintained for the lint
#    warning the toolkit shows. It is copied rather than fetched: the one task in this
#    repo that reads a toolkit YAML over the network carries the scar in its own header
#    (raw.githubusercontent 429d the CI host for minutes under CLEAN_MACHINE), and a
#    config render should not depend on GitHub being reachable. A test compares the two
#    files, so the copy cannot drift silently.
#
# 2. Where that build is published: `header_and_footer_baseurl_bs5`, one variable for
#    the whole portal. Unset, it is the Bootstrap 3 URL plus /bs5, which is where
#    base-branding's `npm run build:bs5` lands and what the branding image serves. A
#    portal that publishes it elsewhere sets it once (gbif.es builds it outside this
#    repo and serves it from .../brand-2025-vite-bs5/bs5). There is deliberately no
#    per-service variable: a host that mixes a Bootstrap 5 app with a Bootstrap 3 one
#    needs no extra configuration, each service picks its own by version.
#
# A portal that set the Bootstrap 5 URL host-wide in `header_and_footer_baseurl` keeps
# working: a URL that already ends in /bs5 is left alone instead of growing a second one.
#
# PARAMETERS (pass through `vars:` on the include)
#   bs5_service    the docker-services-desc key (alerts, logger, collectory...)
#
# The result lands in `la_service_branding_baseurl`, which the caller passes to the
# ala-install role as `header_and_footer_baseurl`. It is deliberately NOT written back
# to `header_and_footer_baseurl` itself: that name is also read, later in the same play,
# by the branding vhost, wait-for-branding and spatial-hub, and a set_fact would leak
# one service's /bs5 into all of them.
#
# The expressions are one line each on purpose: a folded scalar (>-) keeps the newline
# before a more-indented continuation line, and the value would reach the role with a
# line break in it.

- name: "Branding: read what {{ bs5_service }} needs"
  ansible.builtin.set_fact:
    la_bs5_desc: "{{ docker_services_desc.get(bs5_service, {}) }}"
    la_branding_bs3_url: "{{ header_and_footer_baseurl | default('') | regex_replace('/+$', '') }}"
  tags:
    - config
    - branding
    - docker-compose

# A non-numeric pin ("latest", a branch build) keeps Bootstrap 3: guessing wrong there
# would unstyle a portal that works today, and `is version()` raises on it anyway.
- name: "Branding: decide whether {{ bs5_service }} is an ala-bootstrap5 release"
  ansible.builtin.set_fact:
    la_bs5_needed: "{{ (la_bs5_desc.bootstrap5_from is defined) and (la_bs5_version is match('^[0-9]')) and (la_bs5_version is version(la_bs5_desc.bootstrap5_from, '>')) }}"
  vars:
    la_bs5_version: "{{ vars.get(la_bs5_desc.version_variable | default(''), '') | string }}"
  tags:
    - config
    - branding
    - docker-compose

- name: "Branding: pick the build {{ bs5_service }} will be pointed at"
  ansible.builtin.set_fact:
    la_service_branding_baseurl: "{{ (header_and_footer_baseurl | default('')) if not (la_bs5_needed | bool) else (header_and_footer_baseurl_bs5 if (header_and_footer_baseurl_bs5 | default('', true) | length > 0) else la_bs5_derived) }}"
  vars:
    la_bs5_derived: "{{ 'https://www.ala.org.au/commonui-bs5-2019' if (la_branding_bs3_url | length == 0 or 'commonui-bs' in la_branding_bs3_url) else (la_branding_bs3_url if la_branding_bs3_url.endswith('/bs5') else la_branding_bs3_url ~ '/bs5') }}"
  tags:
    - config
    - branding
    - docker-compose

- name: "Branding: show the base URL resolved for {{ bs5_service }}"
  ansible.builtin.debug:
    verbosity: 1
    msg: "{{ bs5_service }} branding: {{ la_service_branding_baseurl }} (bootstrap5: {{ la_bs5_needed }})"
  tags:
    - config
    - branding
    - docker-compose
