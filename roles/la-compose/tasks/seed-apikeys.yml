---
# Service API key seeding
# Called from main.yml AFTER all Docker Compose services are running, next to
# init-cas-admin.yml. It cannot run from init-databases.yml: that block only
# creates the `apikey` DATABASE, and its two tables (`app`, `apikey`) are created
# by Flyway/GORM when la_apikey first boots — i.e. during the `docker compose up`
# that comes later. Seeding pre-up hit "Table 'apikey.app' doesn't exist" on every
# clean deploy (CI #339), and because the loop is no_log the failure was censored
# down to a bare `failed`, taking the whole host out of the play before it
# deployed anything.
#
# Why seed at all: ala-install's apikey role DOES insert every service's key
# (roles/apikey/tasks/main.yml "add apikeys if do not exist" -> apikey-add), but
# the whole loop is gated on `deployment_type == 'vm' or deployment_type is
# undefined`. In container mode it is skipped, so both tables stay EMPTY.
#
# What that costs, verified live: every key answers {"valid":false}, so collectory's
# CollectoryAuthService.isAuthorisedWsRequest falls through to checkJWT() — and in
# collectory 6.0.0 that method calls pac4j's FindBest, a class REMOVED in the pac4j
# 6.0.6 the image ships. Result: every authenticated WS write 500s with
# "MissingPropertyException: No such property: FindBest", with or without credentials.
# A valid API key returns before checkJWT is ever reached, so seeding the keys both
# restores authorisation and routes around the upstream crash. Concretely it unblocks
# registering dataResources, without which la-pipelines' interpret stage silently
# no-ops ("Collectory metadata no available") and no ingest ever indexes anything.

# apikey already declares `depends_on: cas: service_healthy` and start_period 120s,
# so 300s of margin here matches what init-cas-admin.yml allows for CAS itself.
- name: "API keys: Wait for apikey service to be healthy (it creates the schema)"
  ansible.builtin.command: >
    docker inspect --format={{ '{{' }}.State.Health.Status{{ '}}' }} la_apikey
  register: apikey_health
  until: 'apikey_health.stdout == "healthy"'
  retries: 30
  delay: 10
  become: true
  changed_when: false
  tags:
    - apikeys-add

# Deliberately NOT no_log: it carries no secrets, and it is the task that names the
# problem when the schema is missing instead of leaving a censored `failed` behind.
- name: "API keys: Check the apikey schema tables exist"
  ansible.builtin.command: >
    docker exec la_mysql mysql -N -u root -p{{ mysql_root_password }}
    -e "SELECT TABLE_NAME FROM information_schema.TABLES
        WHERE TABLE_SCHEMA = '{{ apikey_db_name | default('apikey') }}'
          AND TABLE_NAME IN ('app', 'apikey');"
  register: apikey_tables
  become: true
  changed_when: false
  tags:
    - apikeys-add

- name: "API keys: Assert the apikey schema is ready"
  ansible.builtin.assert:
    that:
      - apikey_tables is not failed
      - apikey_tables.stdout_lines | length == 2
    fail_msg: |
      FAILED: the '{{ apikey_db_name | default('apikey') }}' database is missing its tables.
      Found: {{ apikey_tables.stdout_lines | default([]) }} (expected: app, apikey)
      These are created by Flyway/GORM on la_apikey startup — check `docker logs la_apikey`.
    success_msg: "OK - app and apikey tables present, safe to seed"
  tags:
    - apikeys-add

# Same SQL shape as apikey-add's add-key.sql (insert-if-absent, CONVERT USING latin1
# so the compare matches the column collation), so a host later migrated VM<->container
# converges to the same rows instead of duplicating them.
- name: "API keys: Seed service keys (ala-install seeds these VM-only)"
  ansible.builtin.command: >
    docker exec la_mysql mysql -u root -p{{ mysql_root_password }}
    {{ apikey_db_name | default('apikey') }} -e "
    INSERT INTO app (name, date_created, user_email, user_id)
      SELECT name, date_created, user_email, user_id FROM
      (SELECT '{{ item.app }}' as name, NOW() as date_created,
              '{{ apikey_def_creator_email }}' as user_email,
              '{{ apikey_def_creator_userid }}' as user_id) t
      WHERE NOT EXISTS (SELECT 1 FROM app a WHERE a.name = CONVERT(t.name USING latin1));
    INSERT INTO apikey (apikey, app_id, date_created, user_email, user_id, enabled)
      SELECT apikey, app_id, date_created, user_email, user_id, enabled FROM
      (SELECT '{{ item.key }}' as apikey, '{{ item.app }}' as app_id, NOW() as date_created,
              '{{ apikey_def_creator_email }}' as user_email,
              '{{ apikey_def_creator_userid }}' as user_id, 1 as enabled) t
      WHERE NOT EXISTS (SELECT 1 FROM apikey a WHERE a.apikey = CONVERT(t.apikey USING latin1));"
  become: true
  loop: "{{ _apikey_seed_list | rejectattr('key', 'equalto', '') | list }}"
  loop_control:
    label: "{{ item.app }}"
  vars:
    # Mirrors ala-install's apikey-add list. The extra 'pipelines' entry for
    # ala_api_key is deliberate: generate-compose.yml shadows pipelines_api_key with
    # `ala_api_key | default('changeme')` for the la-pipelines config render, so the
    # key la_pipelines actually sends is ala_api_key — seeding only the inventory's
    # pipelines_api_key would leave it rejected.
    _apikey_seed_list:
      - { app: "alerts", key: "{{ alerts_apikey | default('') }}" }
      - { app: "bie-index", key: "{{ bie_index_api_key | default('') }}" }
      - { app: "biocache", key: "{{ biocache_api_key | default('') }}" }
      - { app: "collectory", key: "{{ api_key | default('') }}" }
      - { app: "collectory", key: "{{ registry_api_key | default('') }}" }
      - { app: "doi-service", key: "{{ doi_service_apiKey | default('') }}" }
      - { app: "image-service", key: "{{ image_service_apiKey | default('') }}" }
      - { app: "spatialportal", key: "{{ spatial_service_api_key | default('') }}" }
      - { app: "spatialportal", key: "{{ spatial_service_service_key | default('') }}" }
      - { app: "spatialportal", key: "{{ spatial_service_slave_key | default('') }}" }
      - { app: "specieslists", key: "{{ speciesList_api_key | default('') }}" }
      - { app: "pipelines", key: "{{ pipelines_api_key | default('') }}" }
      - { app: "pipelines", key: "{{ ala_api_key | default('') }}" }
      - { app: "data-quality", key: "{{ data_quality_api_key | default('') }}" }
      - { app: "ecodata", key: "{{ ecodata_api_key | default('') }}" }
  when:
    - apikey_def_creator_email is defined
    - apikey_def_creator_userid is defined
  register: apikey_seed
  changed_when: false
  failed_when: false
  no_log: true
  tags:
    - apikeys-add

# The keys live in `cmd`, so no_log above is not negotiable — but mysql writes its
# errors to stderr, which carries none. Surfacing only stderr keeps the secrets out
# of the log while making the next failure self-describing.
- name: "API keys: Report seeding failures (stderr only — cmd carries the keys)"
  ansible.builtin.fail:
    msg: |
      FAILED: {{ _apikey_failures | length }} of {{ apikey_seed.results | length }} API key
      inserts failed. MySQL said:
      {% for f in _apikey_failures %}
        - {{ f.item.app }}: {{ f.stderr | default(f.msg) | default('(no stderr)') }}
      {% endfor %}
  vars:
    _apikey_failures: >-
      {{ apikey_seed.results | default([])
         | rejectattr('skipped', 'defined')
         | selectattr('rc', 'defined')
         | selectattr('rc', 'ne', 0) | list }}
  when: _apikey_failures | length > 0
  tags:
    - apikeys-add
