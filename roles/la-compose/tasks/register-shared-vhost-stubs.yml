---
# Cross-host shared-vhost stub proxying (hub.l-a.site-style: ONE hostname split
# by PATH across DIFFERENT physical hosts, unlike spatial.*/auth.* which share
# a hostname on ONE host). nginx_remote_shared_members (generate-compose.yml,
# right after docker_extra_hosts_dict is built) lists, per shared hostname,
# every member THIS host does not own. Without this, this host's copy of that
# shared hostname would only serve the path(s) it renders locally and 404 on
# every sibling's path.
#
# Proxies straight to the sibling's BACKEND CONTAINER (its published port on
# its private IP, see nginx_shared_ports_needed and the conditional `ports:`
# block in biocache-hub.yml.j2/bie-hub.yml.j2/regions.yml.j2), not to the
# sibling's nginx — so this is a plain HTTP proxy_pass with no TLS/SNI
# question, and touches nothing in ala-install (only the nginx_vhost role's
# already-existing, unmodified `static_upstream`/`proxy_hostname` nginx_paths
# fields are used).
#
# Called ONCE per host, after every local service (portal instance-0 AND
# every hub instance, both rendered earlier in generate-compose.yml) has
# already registered its own real nginx_vhost calls for the hostnames it
# owns, so a stub never races a real registration for the same fragment set
# (nginx_vhost's fragments are path-keyed, so a stub's path — by construction
# never a path this host owns — can never collide with a real one).
- name: "Build stub nginx_paths per shared hostname this host must proxy for"
  ansible.builtin.include_tasks: build-shared-vhost-stub-paths.yml

# The real owner of each proxied path already registers its own gatus check for that
# exact hostname+path (nginx_vhost's gatus template keys its endpoint on hostname+path,
# not on appname — see gatus/templates/http.j2). A stub is never that owner, only a
# proxy_pass to it, so monitoring it here would probe the identical URL a second time
# under a different appname and violate gatus's name+group uniqueness constraint
# ("invalid endpoint ...: name and group combination must be unique", crash-looping
# gatus). use_gatus:false overrides the global `use_gatus` fact (generate-compose.yml,
# "Set use_gatus fact") for this include_role call only: role/include_role params
# outrank set_fact in Ansible's variable precedence, so this is not the same mistake
# the airflow vhost comment above warns about (a Jinja self-reference on the SAME var
# name, which recurses; a literal `false` does not).
- name: "Register cross-host proxy stubs for shared vhost hostnames"
  ansible.builtin.include_role:
    name: nginx_vhost
  vars:
    appname: "{{ stub.key }}-remote"
    hostname: "{{ stub.key }}"
    context_path: "/"
    vhost_required: true
    nginx_vhost_fast_mode: false
    # Into the SAME <hostname>.conf as the local apps (path-keyed fragments, see
    # above). A separate <hostname>-<appname>.conf is a second server block for the
    # same server_name, and nginx ignores it or, worse, the local one.
    vhost_with_appname_conf: false
    nginx_paths: "{{ stub.value }}"
    use_gatus: false
  loop: "{{ (nginx_remote_stub_paths | default({})) | dict2items }}"
  # Not `item`: these vars are templated lazily inside nginx_vhost's own
  # `with_items` tasks, where `item` is a path dict, not this loop's entry.
  loop_control:
    loop_var: stub
    label: "{{ stub.key }}"
  when: (nginx_remote_shared_members | default([])) | length > 0
  tags:
    - docker-compose
    - nginx_vhost

# Migration cleanup: earlier runs assembled the stub into its own
# <hostname>-<hostname>-remote.conf, a second server block for the same server_name
# that made nginx ignore the local one (hub.l-a.site/records 404). Remove it.
- name: "Remove the superseded per-stub vhost files"
  ansible.builtin.file:
    path: "{{ nginx_conf_dir }}/{{ vdir }}/{{ stub.key }}-{{ stub.key }}-remote.conf"
    state: absent
  become: true
  loop: "{{ (nginx_remote_stub_paths | default({})) | dict2items | product(['sites-enabled', 'sites-available']) | list }}"
  loop_control:
    label: "{{ vdir }}/{{ stub.key }}"
  vars:
    stub: "{{ item.0 }}"
    vdir: "{{ item.1 }}"
  when: (nginx_remote_shared_members | default([])) | length > 0
  tags:
    - docker-compose
    - nginx_vhost

# Migration cleanup: earlier runs (before use_gatus:false above) wrote a gatus check
# for this stub, delegated to the gatus host. A redeploy that does not wipe /data (i.e.
# anything short of CLEAN_MACHINE) would otherwise leave that stale file behind forever
# -- gatus globs every *-http.yaml in its config dir, so the duplicate keeps crashing it
# even after this fix stops writing new copies. Same delegate_to/dest as nginx_vhost's
# own gatus task, so it targets exactly the file that task used to create.
- name: "Remove stale gatus check for shared-vhost stubs (superseded by the real owner's check)"
  ansible.builtin.file:
    path: "{{ hostvars[groups['gatus'][0]]['gatus_config_dir'] | default(gatus_config_dir) }}/{{ stub.key }}-remote-http.yaml"
    state: absent
  delegate_to: "{{ groups['gatus'][0] }}"
  loop: "{{ (nginx_remote_stub_paths | default({})) | dict2items }}"
  loop_control:
    loop_var: stub
    label: "{{ stub.key }}"
  when:
    - (nginx_remote_shared_members | default([])) | length > 0
    - groups['gatus'] is defined and groups['gatus'] | length > 0
  tags:
    - docker-compose
    - nginx_vhost
    - gatus
