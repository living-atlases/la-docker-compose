---
# Default-credential guard.
#
# Several templates fall back to a well-known password when the inventory does not supply one
# (`geoserver_password | default('geoserver')`, `cas_db_password | default('password')`...). That
# fallback is silent: the container just starts with a public password. It happens more easily than
# it looks, because a secret is defined in one service group's vars while the template is rendered
# on the `docker_compose` host, and a generator regeneration, a commented line or a group typo is
# enough to drop it (espacial.gbif.es: GeoServer admin ended up as admin/geoserver).
#
# This runs AFTER the service variable loads (so it sees the value the templates will see), right
# before the compose files are generated, for every service that is enabled. It always warns; it
# FAILS the deploy when `la_require_non_default_credentials` is true (default: la_env=production).
# A local/CI stack keeps working untouched.
#
# To add a credential: append to `la_insecure_default_credentials` (defaults/main.yml).

- name: "Credentials: collect enabled services still on a known default"
  ansible.builtin.set_fact:
    la_default_credential_hits: >-
      {%- set hits = [] -%}
      {%- for c in la_insecure_default_credentials -%}
        {%- if c.service in services_enabled
               and (vars.get(c.var) is none
                    or (vars.get(c.var) | string) in [c.value, '']) -%}
          {%- set _ = hits.append(c) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ hits }}
  tags: [always, safety]

- name: "Credentials: WARNING, default password in use"
  ansible.builtin.debug:
    msg: >-
      {{ item.label }}: `{{ item.var }}` is {{ 'not set' if vars.get(item.var) is none else 'the well-known default' }}
      (the container will start with '{{ item.value }}'). Define it in the inventory where the
      docker_compose host can see it (e.g. [<host>_group:vars] or [all:vars]).
  loop: "{{ la_default_credential_hits }}"
  loop_control:
    label: "{{ item.var }}"
  tags: [always, safety]

- name: "Credentials: refuse to deploy with default passwords"
  ansible.builtin.fail:
    msg: |
      CREDENTIAL GATE: these services would start with a well-known default password:
      {% for c in la_default_credential_hits %}
        - {{ c.label }}: {{ c.var }}
      {% endfor %}
      Set them in the inventory (see the warnings above). To deploy anyway (dev/test),
      set la_require_non_default_credentials=false.
  when:
    - la_default_credential_hits | length > 0
    - la_require_non_default_credentials | bool
  tags: [always, safety]
