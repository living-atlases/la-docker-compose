---
# Emit e2e-targets.json — the inventory-driven manifest of resolved public URLs per service,
# consumed by the e2e suite (Cypress) and scripts/verify-deployment.sh.
#
# URLs are built from the SAME *_base_url / *_context_path inventory vars that
# init-cas-admin.yml uses to register OIDC services, so they honour whatever the inventory
# dictates — a subdomain portal (records.l-a.site) or a path portal (portal/biocache-hub).
# Nothing here is hardcoded; a portal that routes by path just yields path URLs.
#
# Regenerable and idempotent (rendered content copy). Runs per host in the docker_compose
# group; the public URLs are the same on every host, so any host's file is authoritative.

- name: "e2e-targets: Assemble per-service public URLs from inventory vars"
  ansible.builtin.set_fact:
    # Each value = base_url ~ context_path, trailing slashes stripped so serviceUrl() joins
    # cleanly (only spatial carries context_path '/' in practice). Empty/relative entries are
    # filtered out in the next step, so a service not exposed here is simply absent.
    _e2e_raw:
      records: "{{ ((biocache_hub_base_url | default('')) ~ (biocache_hub_context_path | default(''))) | regex_replace('/+$', '') }}"
      recordsWs: "{{ ((biocache_service_base_url | default('')) ~ (biocache_service_context_path | default(''))) | regex_replace('/+$', '') }}"
      species: "{{ ((bie_hub_base_url | default('')) ~ (bie_hub_context_path | default(''))) | regex_replace('/+$', '') }}"
      speciesWs: "{{ ((bie_index_base_url | default('')) ~ (bie_index_context_path | default(''))) | regex_replace('/+$', '') }}"
      collections: "{{ ((collectory_base_url | default('')) ~ (collectory_context_path | default(''))) | regex_replace('/+$', '') }}"
      spatial: "{{ ((spatial_base_url | default(spatial_hub_base_url | default(''))) ~ (spatial_hub_context_path | default(''))) | regex_replace('/+$', '') }}"
      lists: "{{ ((lists_base_url | default('')) ~ (lists_context_path | default(''))) | regex_replace('/+$', '') }}"
      images: "{{ ((image_service_base_url | default('')) ~ (image_service_context_path | default(''))) | regex_replace('/+$', '') }}"
      logger: "{{ ((logger_base_url | default('')) ~ (logger_context_path | default(''))) | regex_replace('/+$', '') }}"
      # Name matching. Carries no context path; the species-group and vernacular checks
      # resolve it from here instead of hardcoding a hostname.
      namematching: "{{ (namematching_service_url | default('')) | regex_replace('/+$', '') }}"
      regions: "{{ ((regions_base_url | default('')) ~ (regions_context_path | default(''))) | regex_replace('/+$', '') }}"
      # gatus_url is a bare hostname in the inventory (no scheme) — add https:// when missing.
      gatus: "{{ (('https://' ~ gatus_url) if (gatus_url is defined and gatus_url and not (gatus_url is match('^https?://'))) else (gatus_url | default(''))) | regex_replace('/+$', '') }}"
      # Dev mail catcher. Only emitted when docker_mail_development_mode is on (i.e. the
      # `mail`/`full` compose profile actually runs mailhog); otherwise the key is absent and
      # the mail-dependent e2e checks skip themselves via hasService('mailhog'). Same
      # bare-hostname handling as gatus_url — docker_mail_development_url carries no scheme.
      mailhog: >-
        {{ ('' if not (docker_mail_development_mode | default(false) | bool)
            else (docker_mail_development_url | default(''))
                 if (docker_mail_development_url | default('') is match('^https?://'))
                 else ('https://' ~ docker_mail_development_url) if (docker_mail_development_url | default(''))
                 else '') | regex_replace('/+$', '') }}
      # Where finished offline downloads are served from (biocache download.url). Lets the
      # download spec fetch the produced ZIP without reconstructing the URL itself.
      recordsDownload: "{{ (download_url | default('')) | regex_replace('/+$', '') }}"
  tags:
    - docker-compose
    - e2e-targets

- name: "e2e-targets: Keep only services with an absolute URL (drop absent/relative)"
  ansible.builtin.set_fact:
    e2e_targets_services: >-
      {{ _e2e_raw | dict2items
         | selectattr('value', 'match', '^https?://')
         | list | items2dict }}
  tags:
    - docker-compose
    - e2e-targets

# Data hubs: join every compose host's slice into one cluster-wide list. A hub may
# be SPREAD across hosts (records on host1, species and regions on host3) and the
# Cypress suite reads ONE manifest.
- name: "e2e-targets: Merge each data hub's targets across compose hosts"
  ansible.builtin.include_tasks: merge-hub-e2e-targets.yml
  tags:
    - docker-compose
    - e2e-targets

- name: "e2e-targets: Compose manifest"
  ansible.builtin.set_fact:
    e2e_targets_manifest:
      env: "{{ e2e_env_name | default('deployment') }}"
      root: "{{ (ala_base_url | default(default_logout_redirect_url | default(''))) | regex_replace('/+$', '') }}"
      auth: "{{ (cas_url | default('')) | regex_replace('/+$', '') }}"
      services: "{{ e2e_targets_services }}"
      # Data hubs, each with its own public URLs, branding base and data_hub_uid query
      # context. Collected in the hub loop (generate-hub-instance.yml) while each hub's
      # variables were the loaded ones, then joined across hosts just above; the keys
      # above stay the PORTAL's, so every existing spec keeps working unchanged.
      hubs: "{{ e2e_targets_hubs_merged | default([]) }}"
      # ALA upstreams this deployment deliberately still depends on (see
      # roles/la-compose/defaults/main.yml). The effective-config e2e check treats anything
      # else resolving to ALA infrastructure as a failure, so the declaration has to travel
      # with the manifest rather than being hardcoded in the test.
      alaUpstreamFallbacks: "{{ ala_upstream_fallbacks | default([]) }}"
  tags:
    - docker-compose
    - e2e-targets

# generate-hub-instance.yml is pulled in by a DYNAMIC include whose own tags are
# hubs/config/docker-compose, so a run limited to --tags e2e-targets never enters it and
# e2e_targets_hubs is never accumulated -- the tags on the emitter task itself cannot
# change that, since a dynamic include is selected by the include's tags, not its
# children's. Writing anyway would replace a good manifest with one whose hubs list is
# empty, which the e2e suite reads as "this deployment has no data hubs". So detect the
# case and skip the write instead.
- name: "e2e-targets: Did the hub loop run on this host?"
  ansible.builtin.set_fact:
    _e2e_hubs_not_collected: "{{ ((hub_instances | default([]) | rejectattr('is_portal') | list | length) > 0)
                                 and (e2e_targets_hubs is not defined) }}"
  tags:
    - docker-compose
    - e2e-targets

- name: "e2e-targets: Warn that the manifest is left as it is"
  ansible.builtin.debug:
    msg: >-
      Skipping e2e-targets.json: this host carries data hubs but the hub loop did not run
      in this play (a --tags e2e-targets run skips it). Re-run with --tags docker-compose
      to regenerate the manifest with its hubs.
  when: _e2e_hubs_not_collected
  tags:
    - docker-compose
    - e2e-targets

- name: "e2e-targets: Write {{ docker_compose_data_dir }}/e2e-targets.json"
  ansible.builtin.copy:
    content: "{{ e2e_targets_manifest | to_nice_json }}\n"
    dest: "{{ docker_compose_data_dir }}/e2e-targets.json"
    mode: "0644"
    owner: "{{ docker_compose_userid | default(omit) }}"
    group: "{{ docker_compose_usergid | default(omit) }}"
  become: true
  # Only write when we actually resolved public URLs (portal vars present on this
  # host), or when this host carries a data hub -- an inventory that scopes the
  # portal's *_base_url to a service group instead of [all:vars] would otherwise
  # leave a hub-bearing host with no manifest at all.
  when:
    - not _e2e_hubs_not_collected
    - (e2e_targets_services | length > 0) or (e2e_targets_hubs_merged | default([]) | length > 0)
  tags:
    - docker-compose
    - e2e-targets
