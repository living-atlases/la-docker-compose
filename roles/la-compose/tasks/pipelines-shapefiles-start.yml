---
# The pipelines geocode shapefiles (~243MB) come from an S3 bucket in Sydney at ~140 KB/s:
# 29 min of a clean CI deploy (#426/#427), with the other hosts idle, since the play is
# linear. Nothing needs them until an ingest reaches interpretation, so the download starts
# here, in the background, and pipelines-shapefiles-finish.yml waits for it and unpacks it
# just before `docker compose up`, by when the render has overlapped it.
# ala-install's pipelines role would download them itself ("Download SHP files"), but
# la-compose renders the pipelines config instead of invoking that role, so without this
# interpret dies with "SHP file of State: /data/pipelines-shp/cw_state_poly.dbf does not
# exist!".
- name: Pipelines shapefiles | ensure the directory exists
  ansible.builtin.file:
    path: "{{ data_dir }}/pipelines-shp"
    state: directory
    owner: "{{ docker_container_uid }}"
    group: "{{ docker_container_gid }}"
    mode: '0755'
  become: true

# Keyed on the unpacked marker, like the unarchive: a host that already has them skips
# the download, even if the zip was removed afterwards.
- name: Pipelines shapefiles | check whether they are already unpacked
  ansible.builtin.stat:
    path: "{{ data_dir }}/pipelines-shp/cw_state_poly.dbf"
  register: pipelines_shp_marker
  become: true

- name: Pipelines shapefiles | start the download in the background
  ansible.builtin.get_url:
    url: "{{ pipelines_shapefiles_url | default('https://pipelines-shp.s3-ap-southeast-2.amazonaws.com/pipelines-shapefiles.zip') }}"
    dest: "{{ data_dir }}/pipelines-shp/pipelines-shapefiles.zip"
    checksum: "{{ pipelines_shapefiles_checksum | default('sha1:d4755425902e109e749c319f8d4ee98fa7ef2c4d') }}"
    owner: "{{ docker_container_uid }}"
    group: "{{ docker_container_gid }}"
    mode: '0644'
  become: true
  async: "{{ pipelines_shapefiles_async_timeout | default(5400) }}"
  poll: 0
  register: pipelines_shp_async
  when: not pipelines_shp_marker.stat.exists
